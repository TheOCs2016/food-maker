    <!-- Global Error Handler for Debugging Blank Screens -->
    <script>
        window.addEventListener('error', function(e) {
            const root = document.getElementById('root');
            if (root && root.innerHTML.includes('Loading')) {
                const isSyntax = (e.message || '').toLowerCase().includes('script error') || (e.message || '').toLowerCase().includes('syntax');
                root.innerHTML = '<div style="padding: 2rem; text-align: center; font-family: sans-serif; color: #b91c1c;">' +
                                 '<i class="fa-solid fa-triangle-exclamation" style="font-size: 3rem; margin-bottom: 1rem;"></i>' +
                                 '<h2 style="font-weight: bold; margin-bottom: 1rem; font-size: 1.5rem;">Failed to Load App</h2>' +
                                 '<p style="color: #4b5563; font-size: 0.9rem; margin-bottom: 2rem;">' + (isSyntax ? 'Code Syntax Error. Please check the code for missing brackets or commas.' : (e.message || 'Unknown network or syntax error.')) + '</p>' +
                                 '<button onclick="localStorage.clear(); window.location.reload();" style="padding: 1rem 2rem; background: #1c1917; color: white; border-radius: 0.5rem; border: none; font-weight: bold; cursor: pointer;">Reset App Data</button>' +
                                 '</div>';
            }
        });
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        class ErrorBoundary extends React.Component {
          constructor(props) {
            super(props);
            this.state = { hasError: false };
          }
          static getDerivedStateFromError(error) {
            return { hasError: true };
          }
          componentDidCatch(error, errorInfo) {
            console.error("Food Maker caught an error:", error, errorInfo);
          }
          render() {
            if (this.state.hasError) {
              return (
                <div className="h-full w-full flex flex-col items-center justify-center p-6 text-center bg-[#FAF8F5] font-sans">
                  <i className="fa-solid fa-triangle-exclamation text-5xl text-rose-400 mb-4"></i>
                  <h2 className="text-2xl font-display font-extrabold text-stone-800 mb-2">Oops! Something broke.</h2>
                  <p className="font-sans text-stone-500 mb-8 max-w-xs">The app encountered a rendering error. This usually happens if the local save data was corrupted.</p>
                  <button 
                    onClick={() => {
                      localStorage.clear();
                      window.location.reload();
                    }}
                    className="bg-stone-900 text-white font-display font-bold px-6 py-4 rounded-xl shadow-md active:scale-95 transition-transform"
                  >
                    Reset App & Reload
                  </button>
                </div>
              );
            }
            return this.props.children;
          }
        }

        const SettingsView = ({ appData, favourites, queue, onImport, setAlertMsg }) => {
            const handleExport = () => {
                const data = { appData, favourites, queue };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'food-maker-backup.json';
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (imported.appData && imported.favourites && imported.queue) {
                            onImport(imported);
                            setAlertMsg("Data imported successfully!");
                        } else {
                            setAlertMsg("Invalid backup file.");
                        }
                    } catch (error) {
                        setAlertMsg("Error reading file.");
                    }
                };
                reader.readAsText(file);
            };

                <div className="h-full px-4 pb-4 pt-4 overflow-y-auto font-sans">

                                <i className="fa-solid fa-upload"></i> Import Data
                                <input type="file" accept=".json" className="hidden" onChange={handleImport} />
                            </label>
                        </div>
                    </div>
                </div>
            );
        };

        const TrashView = ({ trash, onRestore, onDeletePerm }) => (
            <div className="h-full px-4 pb-4 pt-4 overflow-y-auto bg-stone-100/50 font-sans">
                {trash.length === 0 ? (
                    <div className="flex flex-col items-center justify-center h-64 text-stone-400 font-sans text-center px-8">
                        <i className="fa-solid fa-trash text-5xl mb-4 text-stone-200"></i>
                        <p className="font-sans">No deleted recipes.</p>
                    </div>
                ) : (
                    <div className="grid grid-cols-1 gap-3">
                        {trash.map(recipe => (
                            <div key={recipe.id} className="bg-white border-2 border-stone-100 rounded-[1.25rem] p-5 text-left shadow-sm flex flex-col gap-3">
                                <div>
                                    <h3 className="font-display text-lg font-bold text-stone-800">{recipe.name}</h3>
                                    <p className="font-sans text-stone-500 text-sm mt-1">{recipe.variations.length} variations</p>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => onRestore(recipe)} className="flex-1 bg-amber-50 text-amber-700 font-sans font-bold py-2 rounded-lg text-sm active:scale-95 transition-transform">Restore</button>
                                    <button onClick={() => onDeletePerm(recipe.id)} className="flex-1 bg-rose-50 text-rose-700 font-sans font-bold py-2 rounded-lg text-sm active:scale-95 transition-transform">Delete Forever</button>
                                </div>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        );

        const CreateRecipeView = ({ onSave, categories, recipes, showAlert }) => {
          const [sourceRecipeId, setSourceRecipeId] = useState('');
          const [categoryId, setCategoryId] = useState('');
          const [foodName, setFoodName] = useState('');
          const [varName, setVarName] = useState('');
          const [baseYield, setBaseYield] = useState('');
          const [yieldUnit, setYieldUnit] = useState('');
          const [ingredients, setIngredients] = useState([{ name: '', baseAmount: '', unit: '', volAmount: '', volUnit: '', group: '' }]);
          const [steps, setSteps] = useState(['']);
          const [notes, setNotes] = useState('');
          const [source, setSource] = useState('');

          const addIngredient = () => setIngredients([...ingredients, { name: '', baseAmount: '', unit: '', volAmount: '', volUnit: '', group: '' }]);
          const updateIngredient = (index, field, value) => {
            const newIngs = [...ingredients];
            newIngs[index][field] = value;
            setIngredients(newIngs);
          };
          
          const addStep = () => setSteps([...steps, '']);
          const updateStep = (index, value) => {
            const newSteps = [...steps];
            newSteps[index] = value;
            setSteps(newSteps);
          };

          const handleClone = (e) => {
             const val = e.target.value;
             setSourceRecipeId(val);
             if(!val) return;
             const [fId, vId] = val.split('|');
             const food = recipes[fId];
             const variation = food.variations.find(v => v.id === vId);

             setCategoryId(food.categoryId || categoryId || 'snacks');
             setFoodName(food.name + ' (Copy)');
             setVarName(variation.name);
             setBaseYield(variation.baseYield);
             setYieldUnit(variation.yieldUnit || 'portions');
             setNotes(variation.notes ? variation.notes.join('\n') : '');
             setSource(variation.source || '');
             setIngredients(variation.ingredients.map(ing => ({
                name: ing.name,
                baseAmount: ing.baseAmount,
                unit: ing.unit,
                volAmount: ing.volAmount || '',
                volUnit: ing.volUnit || '',
                group: ing.group || ''
             })));
             setSteps([...variation.steps]);
          };

          const handleSave = () => {
            if (!categoryId || !foodName || !varName || !baseYield) return showAlert("Please fill the basic details and select a category.");
            
            const newRecipe = {
              id: foodName.toLowerCase().replace(/\s+/g, '-'),
              name: foodName,
              isCustom: true,
              categoryId: categoryId,
              variations: [{
                id: varName.toLowerCase().replace(/\s+/g, '-'),
                name: varName,
                description: "Custom recipe created by you.",
                bg: 'from-amber-100 to-orange-100',
                baseYield: parseFloat(baseYield),
                yieldUnit: yieldUnit || 'portions',
                notes: notes.trim() ? notes.split('\n').filter(n => n.trim() !== '') : [],
                source: source.trim() || undefined,
                ingredients: ingredients.map((ing, i) => ({
                  id: `ing-${i}`,
                  name: ing.name,
                  baseAmount: parseFloat(ing.baseAmount),
                  unit: ing.unit,
                  volAmount: ing.volAmount ? parseFloat(ing.volAmount) : undefined,
                  volUnit: ing.volUnit || undefined,
                  group: ing.group.trim() || undefined
                })).filter(ing => ing.name && !isNaN(ing.baseAmount)),
                steps: steps.filter(s => s.trim() !== '')
              }]
            };
            onSave({ newRecipe, categoryId });
          };

          const availableFoodsInCat = categoryId ? categories.find(c => c.id === categoryId)?.subcategories?.flatMap(sub => sub.foods?.map(f => f.id) || []) || [] : [];

          return (
            <div className="h-full p-4 pt-4 overflow-y-auto pb-24 font-sans">
              <div className="space-y-6">
                <div className="bg-white p-5 rounded-[1.25rem] shadow-sm border border-stone-200">
                  <h3 className="font-display font-bold text-stone-800 mb-4">Category & Template</h3>
                  <select className="w-full mb-3 p-3 bg-stone-50 rounded-xl border border-stone-200 outline-none focus:border-amber-400 font-sans text-sm text-stone-700 cursor-pointer" value={categoryId} onChange={e => { setCategoryId(e.target.value); setSourceRecipeId(''); }}>
                    <option value="" disabled>1. Select a Category...</option>
                    {categories.map(cat => <option key={cat.id} value={cat.id}>{cat.name}</option>)}
                  </select>
                  {categoryId && (
                    <select value={sourceRecipeId} onChange={handleClone} className="w-full mb-3 p-3 bg-stone-50 rounded-xl border border-stone-200 outline-none focus:border-amber-400 font-sans text-sm text-stone-700 cursor-pointer">
                       <option value="">2. Start from scratch or clone...</option>
                       {Object.values(recipes).filter(food => availableFoodsInCat.includes(food.id)).map(food => (
                           <optgroup key={food.id} label={food.name}>
                               {food.variations.map(v => (
                                   <option key={v.id} value={`${food.id}|${v.id}`}>{v.name}</option>
                               ))}
                           </optgroup>
                       ))}
                    </select>
                  )}
                </div>

                <div className="bg-white p-5 rounded-[1.25rem] shadow-sm border border-stone-200">
                  <h3 className="font-display font-bold text-stone-800 mb-4">General Details</h3>
                  <input className="w-full mb-3 p-3 bg-stone-50 rounded-xl border border-stone-200 outline-none focus:border-amber-400 font-sans placeholder:text-xs text-sm text-stone-700" placeholder="Food Name" value={foodName} onChange={e => setFoodName(e.target.value)} />
                  <input className="w-full mb-3 p-3 bg-stone-50 rounded-xl border border-stone-200 outline-none focus:border-amber-400 font-sans placeholder:text-xs text-sm text-stone-700" placeholder="Variation Name" value={varName} onChange={e => setVarName(e.target.value)} />
                  <div className="flex gap-3">
                    <input type="number" className="min-w-0 flex-1 p-3 bg-stone-50 rounded-xl border border-stone-200 outline-none focus:border-amber-400 font-sans placeholder:text-xs text-sm text-stone-700" placeholder="Base Yield" value={baseYield} onChange={e => setBaseYield(e.target.value)} />
                    <input className="min-w-0 flex-1 p-3 bg-stone-50 rounded-xl border border-stone-200 outline-none focus:border-amber-400 font-sans placeholder:text-xs text-sm text-stone-700" placeholder="Yield Unit" value={yieldUnit} onChange={e => setYieldUnit(e.target.value)} />
                  </div>
                </div>

                <div className="bg-white p-5 rounded-[1.25rem] shadow-sm border border-stone-200">
                  <div className="flex justify-between items-center mb-4">
                    <h3 className="font-display font-bold text-stone-800">Ingredients</h3>
                    <button onClick={addIngredient} className="text-amber-600 p-1 bg-amber-50 rounded-lg"><i className="fa-solid fa-plus"></i></button>
                  </div>
                  {ingredients.map((ing, i) => (
                    <div key={i} className="mb-4 pb-4 border-b border-stone-100 last:border-0 last:pb-0">
                      <input className="w-full mb-2 p-3 bg-stone-50 rounded-xl border border-stone-200 outline-none font-sans text-sm placeholder:text-xs text-stone-700" placeholder="Section / Group (e.g., 'Glaze') - Optional" value={ing.group} onChange={e => updateIngredient(i, 'group', e.target.value)} />
                      <div className="flex gap-2 mb-2">
                        <input className="min-w-0 flex-[2] p-3 bg-stone-50 rounded-xl border border-stone-200 outline-none font-sans text-sm placeholder:text-xs text-stone-700" placeholder="Name" value={ing.name} onChange={e => updateIngredient(i, 'name', e.target.value)} />
                        <input type="number" className="min-w-0 flex-[1] p-3 bg-stone-50 rounded-xl border border-stone-200 outline-none font-sans text-sm placeholder:text-xs text-stone-700" placeholder="Metric Amt" value={ing.baseAmount} onChange={e => updateIngredient(i, 'baseAmount', e.target.value)} />
                        <select className="min-w-0 flex-[1.2] p-3 bg-stone-50 rounded-xl border border-stone-200 outline-none font-sans text-sm text-stone-700 cursor-pointer" value={ing.unit} onChange={e => updateIngredient(i, 'unit', e.target.value)}>
                          <option value="" disabled>Unit</option>
                          <optgroup label="Metric">
                            <option value="g">g</option>
                            <option value="kg">kg</option>
                            <option value="ml">ml</option>
                            <option value="l">l</option>
                          </optgroup>
                          <optgroup label="Other">
                            <option value="units">units</option>
                            <option value="pieces">pieces</option>
                            <option value="slices">slices</option>
                            <option value="portions">portions</option>
                          </optgroup>
                        </select>
                      </div>
                      <div className="flex gap-2">
                         <input type="number" className="min-w-0 flex-[1] p-3 bg-stone-50 rounded-xl border border-stone-200 outline-none font-sans text-sm placeholder:text-xs text-stone-700" placeholder="Volume Amt (Opt)" value={ing.volAmount} onChange={e => updateIngredient(i, 'volAmount', e.target.value)} />
                         <select className="min-w-0 flex-[1] p-3 bg-stone-50 rounded-xl border border-stone-200 outline-none font-sans text-sm text-stone-700 cursor-pointer" value={ing.volUnit} onChange={e => updateIngredient(i, 'volUnit', e.target.value)}>
                             <option value="">Vol Unit (Opt)</option>
                             <option value="tsp">tsp</option>
                             <option value="tbsp">tbsp</option>
                             <option value="cup">cup</option>
                             <option value="cups">cups</option>
                             <option value="oz">oz</option>
                         </select>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="bg-white p-5 rounded-[1.25rem] shadow-sm border border-stone-200">
                  <div className="flex justify-between items-center mb-4">
                    <h3 className="font-display font-bold text-stone-800">Steps</h3>
                    <button onClick={addStep} className="text-amber-600 p-1 bg-amber-50 rounded-lg"><i className="fa-solid fa-plus"></i></button>
                  </div>
                  {steps.map((step, i) => (
                    <div key={i} className="flex gap-2 mb-3 items-start">
                      <span className="mt-3 font-sans text-stone-400 font-bold">{i+1}.</span>
                      <textarea className="min-w-0 flex-1 p-3 bg-stone-50 rounded-xl border border-stone-200 outline-none font-sans text-sm placeholder:text-xs text-stone-700 min-h-[60px]" placeholder={`Step ${i+1}`} value={step} onChange={e => updateStep(i, e.target.value)} />
                    </div>
                  ))}
                </div>

                <div className="bg-white p-5 rounded-[1.25rem] shadow-sm border border-stone-200">
                  <h3 className="font-display font-bold text-stone-800 mb-4">Additional Info</h3>
                  <textarea className="w-full mb-3 p-3 bg-stone-50 rounded-xl border border-stone-200 outline-none focus:border-amber-400 font-sans text-sm placeholder:text-xs text-stone-700 min-h-[80px]" placeholder="Recipe Notes (Optional. Put each note on a new line.)" value={notes} onChange={e => setNotes(e.target.value)} />
                  <input className="w-full p-3 bg-stone-50 rounded-xl border border-stone-200 outline-none focus:border-amber-400 font-sans placeholder:text-xs text-sm text-stone-700" placeholder="Source URL or Text (Optional)" value={source} onChange={e => setSource(e.target.value)} />
                </div>

                <button onClick={handleSave} className="w-full bg-stone-900 text-white font-sans font-bold text-lg p-4 rounded-xl flex items-center justify-center gap-2 hover:bg-stone-800 transition-colors">
                  <i className="fa-solid fa-floppy-disk"></i> Save Recipe
                </button>
              </div>
            </div>
          );
        };

        const VariationsView = ({ food, onSelectVariation, onLongPress, onDeleteRecipe }) => {
          const timerRef = useRef(null);

          const handlePointerDown = (variationId) => {
            timerRef.current = setTimeout(() => {
              onLongPress(food.id, variationId);
            }, 600);
          };

          const handlePointerUp = () => {
            if (timerRef.current) clearTimeout(timerRef.current);
          };

          return (
            <div className="h-full p-4 overflow-y-auto pb-20 font-sans pt-4">
              <div className="flex justify-between items-start mb-2">
                <h2 className="text-[1.7rem] font-display font-extrabold text-stone-800 tracking-tight line-clamp-1 pr-8">{food.name}</h2>
                {food.isCustom && (
                  <button onClick={() => onDeleteRecipe(food)} className="p-3 -mr-2 -mt-2 text-rose-400 hover:text-rose-600 active:scale-95 transition-all">
                    <i className="fa-solid fa-trash text-xl"></i>
                  </button>
                )}
              </div>
              <p className="font-sans text-stone-500 font-medium mb-6">Which {food.name} recipe do you want to make today? <br/><span className="text-xs text-stone-400 font-sans">(Tip: Hold down a card to quickly save it)</span></p>
              
              <div className="space-y-4">
                {food?.variations?.map(variation => (
                  <button
                    key={variation.id}
                    onPointerDown={() => handlePointerDown(variation.id)}
                    onPointerUp={handlePointerUp}
                    onPointerLeave={handlePointerUp}
                    onClick={() => onSelectVariation(variation.id)}
                    className="w-full text-left bg-white rounded-[1.25rem] shadow-sm border border-stone-200 hover:border-amber-400 hover:shadow-md transition-all active:scale-[0.98] flex flex-col p-5 touch-action-manipulation select-none"
                  >
                    <div className="flex justify-between items-center w-full mb-2">
                      <h3 className="text-xl font-display font-extrabold text-stone-800 transition-colors">{variation.name}</h3>
                      <i className="fa-solid fa-chevron-right text-stone-300 transition-colors"></i>
                    </div>
                    {variation.description && <p className="font-sans text-stone-500 text-sm leading-relaxed">{variation.description}</p>}
                  </button>
                ))}
              </div>
            </div>
          );
        };

        const CalcModeView = ({ onSelectMode }) => (
          <div className="h-full p-4 overflow-y-auto pb-20 font-sans">
            <h2 className="text-[1.7rem] font-display font-extrabold text-stone-800 tracking-tight mb-2">How to calculate?</h2>
            <p className="font-sans text-stone-500 font-medium mb-6">Choose how you want to measure your ingredients.</p>
            <div className="space-y-4">
              <button
                onClick={() => onSelectMode('specific')}
                className="w-full text-left bg-white p-6 rounded-[1.25rem] shadow-sm border border-stone-200 hover:border-amber-400 transition-all active:scale-[0.98] group flex flex-col gap-4"
              >
                <div className="bg-[#F8F2EA] w-12 h-12 rounded-2xl flex items-center justify-center group-hover:scale-110 transition-transform">
                  <i className="fa-solid fa-calculator text-2xl text-[#9A623A]"></i>
                </div>
                <div>
                  <h3 className="text-xl font-display font-extrabold text-[#332211] mb-1">Specific amount</h3>
                  <p className="font-sans text-stone-500 text-sm leading-relaxed">Tell us how many portions you want to make and we'll calculate the whole recipe.</p>
                </div>
              </button>

              <button
                onClick={() => onSelectMode('availability')}
                className="w-full text-left bg-gradient-to-br from-[#FDE397] to-[#E5AC44] p-6 rounded-[1.25rem] shadow-sm border border-amber-200 hover:shadow-md transition-all active:scale-[0.98] group flex flex-col gap-4"
              >
                <div className="bg-[#FEF1CD] w-12 h-12 rounded-2xl flex items-center justify-center group-hover:scale-110 transition-transform shadow-sm">
                  <i className="fa-solid fa-leaf text-2xl text-[#824E26]"></i>
                </div>
                <div>
                  <h3 className="text-xl font-display font-extrabold text-[#412510] mb-1">Use what I have</h3>
                  <p className="font-sans text-[#6C441D] text-sm leading-relaxed font-medium">Enter available ingredients and find out how many portions it yields.</p>
                </div>
              </button>
            </div>
          </div>
        );

        const RecipeView = ({ variation, mode, calcParams, setCalcParams, onUpdateVariation }) => {
          const [draggedId, setDraggedId] = useState(null);
          const [dragOverId, setDragOverId] = useState(null);

          useEffect(() => {
            if (mode === 'specific' && calcParams.targetYield === null) {
              setCalcParams(prev => ({ ...prev, targetYield: variation.baseYield }));
            } else if (mode === 'availability' && calcParams.selectedIngId === null) {
              setCalcParams(prev => ({ ...prev, selectedIngId: variation.ingredients[0].id, availableAmt: variation.ingredients[0].baseAmount }));
            }
          }, [mode, variation, calcParams.targetYield, calcParams.selectedIngId, setCalcParams]);

          const displayTargetYield = calcParams.targetYield !== null ? calcParams.targetYield : variation.baseYield;
          const displaySelectedIngId = calcParams.selectedIngId !== null ? calcParams.selectedIngId : variation.ingredients[0].id;
          const displayAvailableAmt = calcParams.availableAmt !== null ? calcParams.availableAmt : variation.ingredients[0].baseAmount;

          let multiplier = 1;
          let estimatedYield = variation.baseYield;

          if (mode === 'specific') {
            const parsedYield = parseFloat(displayTargetYield) || 0;
            multiplier = parsedYield / variation.baseYield;
            estimatedYield = parsedYield;
          } else {
            const baseIng = variation.ingredients.find(i => i.id === displaySelectedIngId);
            const parsedAmt = parseFloat(displayAvailableAmt) || 0;
            if(baseIng) multiplier = parsedAmt / baseIng.baseAmount;
            estimatedYield = variation.baseYield * multiplier;
          }

          const formatAmount = (ing) => {
            const calcMetric = ing.baseAmount * multiplier;
            const calcVol = ing.volAmount ? ing.volAmount * multiplier : null;

            let metricStr = isNaN(calcMetric) || calcMetric === 0 ? "0" : 
                (ing.unit === 'units' || ing.unit === 'cm' || ing.unit === 'slices' || ing.unit === 'pieces' || ing.unit === 'handful' ? calcMetric.toFixed(1).replace('.0', '') : Math.round(calcMetric).toString());
            
            let volStr = null;
            if (calcVol) {
               volStr = parseFloat(calcVol.toFixed(2)).toString(); 
            }

            return {
              metricVal: metricStr,
              metricUnit: ing.unit,
              volVal: volStr,
              volUnit: ing.volUnit
            };
          };

          const handleDragStart = (e, id) => {
             e.dataTransfer.setData('text/plain', id);
             e.dataTransfer.effectAllowed = 'move';
             setDraggedId(id);
          };

          const handleDragOver = (e, id) => {
             e.preventDefault();
             e.dataTransfer.dropEffect = 'move';
             if (id !== dragOverId) setDragOverId(id);
          };

          const handleDragEnd = () => {
             setDraggedId(null);
             setDragOverId(null);
          };

          const handleDrop = (e, targetId) => {
             e.preventDefault();
             const sourceId = e.dataTransfer.getData('text/plain');
             if (sourceId && sourceId !== targetId) {
                 const sourceIdx = variation.ingredients.findIndex(i => i.id === sourceId);
                 const targetIdx = variation.ingredients.findIndex(i => i.id === targetId);
                 if (sourceIdx > -1 && targetIdx > -1) {
                     const targetGroup = variation.ingredients[targetIdx].group || '';
                     const newIngs = [...variation.ingredients];
                     const [moved] = newIngs.splice(sourceIdx, 1);
                     moved.group = targetGroup;
                     newIngs.splice(targetIdx, 0, moved);
                     onUpdateVariation({ ...variation, ingredients: newIngs });
                 }
             }
             setDraggedId(null);
             setDragOverId(null);
          };

          const ingredientGroups = variation.ingredients.reduce((acc, ing) => {
            const groupName = ing.group || 'Ingredients';
            if (!acc[groupName]) acc[groupName] = [];
            acc[groupName].push(ing);
            return acc;
          }, {});

          return (
            <div className="h-full p-4 overflow-y-auto pb-24 scroll-smooth font-sans">
              {mode === 'specific' ? (
                <div className="bg-white p-6 rounded-[1.25rem] shadow-sm border border-stone-200 mb-8 pl-10 font-sans">
                  <label className="block text-[0.7rem] font-sans font-bold text-stone-500 mb-2 uppercase tracking-wide">
                    How many {variation.yieldUnit} do you want?
                  </label>
                  <div className="flex items-end gap-3 pl-4">
                    <input 
                      type="number" 
                      min="0"
                      value={displayTargetYield} 
                      onChange={e => setCalcParams(prev => ({ ...prev, targetYield: e.target.value }))} 
                      className="w-full text-4xl font-display font-extrabold text-stone-800 bg-transparent border-b-2 border-stone-200 focus:border-amber-500 outline-none pb-2 transition-colors pl-2" 
                    />
                    <span className="text-base font-sans font-bold text-stone-400 pb-2">{variation.yieldUnit}</span>
                  </div>
                </div>
              ) : (
                <div className="bg-white p-6 rounded-[1.25rem] shadow-sm border border-stone-200 mb-8 flex flex-col gap-6 relative overflow-hidden pl-10 font-sans">
                  <div className="absolute top-0 left-0 w-1.5 h-full bg-amber-400"></div>
                  <div>
                    <label className="block text-[0.7rem] font-sans font-bold text-stone-500 mb-2 uppercase tracking-wide">Base ingredient</label>
                    <div className="pl-4">
                        <select 
                          value={displaySelectedIngId} 
                          onChange={e => {
                            const newBaseIng = variation.ingredients.find(i => i.id === e.target.value);
                            setCalcParams(prev => ({ ...prev, selectedIngId: e.target.value, availableAmt: newBaseIng.baseAmount }));
                          }} 
                          className="w-full text-base font-sans font-bold text-stone-800 bg-transparent border-b-2 border-stone-200 focus:border-amber-500 outline-none pb-2 cursor-pointer pl-1"
                        >
                          {variation.ingredients.map(ing => <option key={ing.id} value={ing.id}>{ing.name}</option>)}
                        </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-[0.7rem] font-sans font-bold text-stone-500 mb-2 uppercase tracking-wide">Available amount</label>
                    <div className="flex items-end gap-3 pl-4">
                      <input 
                        type="number" 
                        min="0"
                        value={displayAvailableAmt} 
                        onChange={e => setCalcParams(prev => ({ ...prev, availableAmt: e.target.value }))} 
                        className="w-full text-4xl font-display font-extrabold text-stone-800 bg-transparent border-b-2 border-stone-200 focus:border-amber-500 outline-none pb-2 transition-colors pl-2" 
                      />
                      <span className="text-base font-sans font-bold text-stone-400 pb-2">
                        {variation.ingredients.find(i => i.id === displaySelectedIngId)?.unit || ''}
                      </span>
                    </div>
                  </div>
                  <div className="bg-amber-50 border border-amber-100 text-[#824E26] p-4 rounded-xl flex items-center justify-between mt-2 shadow-sm ml-[-0.5rem]">
                    <span className="font-sans font-semibold text-sm">Estimated yield:</span>
                    <span className="font-display font-extrabold text-lg">{Math.round(estimatedYield || 0)} {variation.yieldUnit}</span>
                  </div>
                </div>
              )}
              
              <h3 className="text-xl font-display font-extrabold text-stone-800 tracking-tight mb-4">Ingredients</h3>
              <div className="bg-white rounded-[1.25rem] shadow-sm border border-stone-200 overflow-hidden mb-8 font-sans">
                {Object.entries(ingredientGroups).map(([groupName, ings], gIdx) => (
                  <React.Fragment key={gIdx}>
                    {(Object.keys(ingredientGroups).length > 1 || groupName !== 'Ingredients') && (
                      <div className="bg-stone-50 px-4 py-2.5 border-y border-stone-200 first:border-t-0 flex items-center">
                        <span className="font-sans font-bold text-stone-500 text-xs uppercase tracking-wider">{groupName}</span>
                      </div>
                    )}
                    <ul className="divide-y divide-stone-100 font-sans">
                      {ings?.map(ing => {
                        const formatted = formatAmount(ing);
                        return (
                          <li 
                            key={ing.id} 
                            draggable="true"
                            onDragStart={(e) => handleDragStart(e, ing.id)}
                            onDragOver={(e) => handleDragOver(e, ing.id)}
                            onDrop={(e) => handleDrop(e, ing.id)}
                            onDragEnd={handleDragEnd}
                            className={`p-4 flex items-center justify-between hover:bg-stone-50 transition-colors cursor-move font-sans ${draggedId === ing.id ? 'opacity-40 bg-stone-100' : ''} ${dragOverId === ing.id && draggedId !== ing.id ? 'border-t-2 border-amber-400 bg-amber-50' : ''}`}
                          >
                            <div className="flex flex-1 items-center gap-3">
                                <i className="fa-solid fa-grip-vertical text-stone-300 active:text-stone-500 touch-none px-2 py-1"></i>
                                <span className="font-sans text-stone-700 font-medium text-[0.95rem] leading-relaxed pr-2">{ing.name}</span>
                            </div>
                            <div className="text-right shrink-0 ml-4 flex flex-col items-end font-sans">
                              {/* Primary: Metric system */}
                              <div className="font-sans text-stone-800 font-bold text-[0.95rem]">
                                {formatted.metricVal} <span className="font-medium text-stone-600">{formatted.metricUnit}</span>
                              </div>
                              {/* Secondary: Customary system */}
                              {formatted.volVal && (
                                <div className="font-sans text-stone-400 text-xs font-medium mt-0.5">
                                  {formatted.volVal} {formatted.volUnit}
                                </div>
                              )}
                            </div>
                          </li>
                        );
                      })}
                    </ul>
                  </React.Fragment>
                ))}
              </div>

              <h3 className="text-xl font-display font-extrabold text-stone-800 tracking-tight mb-5">Instructions</h3>
              <div className="space-y-5 font-sans">
                {variation?.steps?.map((step, index) => (
                  <div key={index} className="flex gap-3 items-start">
                    <div className="w-7 h-7 rounded-full bg-[#C66D29] text-white flex items-center justify-center font-sans font-bold shrink-0 mt-0.5 shadow-sm text-sm">
                      {index + 1}
                    </div>
                    <p className="font-sans text-stone-700 font-normal leading-relaxed pt-0.5 text-[0.95rem]">{step}</p>
                  </div>
                ))}
              </div>

              {variation?.notes && variation.notes.length > 0 && (
                <div className="mt-8 pt-8 border-t border-stone-200 font-sans">
                  <h3 className="text-xl font-display font-extrabold text-stone-800 tracking-tight mb-4">Notes</h3>
                  <ul className="list-disc pl-5 space-y-2 text-stone-600 font-sans text-[0.95rem] leading-relaxed">
                    {variation.notes.map((note, i) => <li key={i} dangerouslySetInnerHTML={{ __html: note }} />)}
                  </ul>
                </div>
              )}

              {variation?.source && (
                <div className="mt-8 text-sm text-stone-500 font-sans bg-stone-100 p-4 rounded-xl flex flex-col gap-1">
                  <span className="font-bold font-sans text-stone-700">Source: </span>
                  {variation.source.startsWith('http') ? (
                    <a href={variation.source} target="_blank" className="text-amber-600 hover:text-amber-700 underline break-all font-sans">{variation.source}</a>
                  ) : (
                    <span className="font-sans">{variation.source}</span>
                  )}
                </div>
              )}
            </div>
          );
        };

        const App = () => {
          const [appData, setAppData] = useState(() => {
            try {
                const saved = localStorage.getItem('foodMakerAppData');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    
                    // Safely merge menu: prioritize the official hardcoded menu so no categories are ever lost.
                    const mergedMenu = initialAppData.menu.map(initialCat => {
                       const savedCat = parsed.menu?.find(c => c.id === initialCat.id);
                       if (savedCat) {
                           // Keep user's custom recipes subcategory if it exists
                           const myRecipesSub = savedCat.subcategories?.find(s => s.id === 'my-recipes');
                           if (myRecipesSub) {
                               return { ...initialCat, subcategories: [...initialCat.subcategories, myRecipesSub] };
                           }
                       }
                       return initialCat;
                    });

                    // Safely merge recipes: Force all hardcoded recipes to be present, keep user's custom ones.
                    const mergedRecipes = { ...initialAppData.recipes };
                    if (parsed.recipes) {
                        Object.keys(parsed.recipes).forEach(key => {
                            if (parsed.recipes[key].isCustom) {
                                mergedRecipes[key] = parsed.recipes[key];
                            }
                        });
                    }

                    return {
                        ...initialAppData,
                        ...parsed,
                        recipes: mergedRecipes,
                        menu: mergedMenu,
                        latestUpdates: initialAppData.latestUpdates, // Force Discover page to stay beautiful
                        trash: parsed.trash || []
                    };
                }
            } catch (error) {
                console.error("Failed to parse Local Storage, resetting to defaults:", error);
            }
            return initialAppData;
          });
          
          const [favourites, setFavourites] = useState(() => {
              try { return JSON.parse(localStorage.getItem('foodMakerFavs')) || []; } 
              catch(e) { return []; }
          }); 
          const [queue, setQueue] = useState(() => {
              try { return JSON.parse(localStorage.getItem('foodMakerQueue')) || []; } 
              catch(e) { return []; }
          }); 

          useEffect(() => localStorage.setItem('foodMakerAppData', JSON.stringify(appData)), [appData]);
          useEffect(() => localStorage.setItem('foodMakerFavs', JSON.stringify(favourites)), [favourites]);
          useEffect(() => localStorage.setItem('foodMakerQueue', JSON.stringify(queue)), [queue]);

          const [view, setView] = useState('home'); 
          const [foodId, setFoodId] = useState(null);
          const [variationId, setVariationId] = useState(null);
          const [calcMode, setCalcMode] = useState(null);
          const [isMenuOpen, setIsMenuOpen] = useState(false);
          const [alertMsg, setAlertMsg] = useState(null);
          const [calcParams, setCalcParams] = useState({ targetYield: null, selectedIngId: null, availableAmt: null });
          const [longPressModal, setLongPressModal] = useState(null);

          const handleSelectFood = (id) => {
            setFoodId(id);
            setView('variations');
          };

          const handleSelectVariation = (id) => {
            setVariationId(id);
            setCalcParams({ targetYield: null, selectedIngId: null, availableAmt: null });
            setView('calcMode');
          };

          const handleSelectMode = (mode) => {
            setCalcMode(mode);
            setView('recipe');
          };

          const handleSelectSaved = (savedItem) => {
            setFoodId(savedItem.foodId);
            setVariationId(savedItem.variationId);
            if (savedItem.mode) {
                setCalcMode(savedItem.mode);
                setCalcParams({
                    targetYield: savedItem.targetYield,
                    selectedIngId: savedItem.selectedIngId,
                    availableAmt: savedItem.availableAmt
                });
                setView('recipe');
            } else {
                setCalcParams({ targetYield: null, selectedIngId: null, availableAmt: null });
                setView('calcMode');
            }
          };

          const goBack = () => {
            if (view === 'recipe') setView('calcMode');
            else if (view === 'calcMode') setView('variations');
            else if (view === 'variations') {
              setView('home');
              setFoodId(null);
            }
            else if (['favourites', 'queue', 'create', 'settings', 'trash'].includes(view)) setView('home');
          };

          const isCurrentSaved = (list) => list.some(item =>
               item.foodId === foodId &&
               item.variationId === variationId &&
               item.mode === calcMode &&
               String(item.targetYield) === String(calcParams.targetYield) &&
               String(item.selectedIngId) === String(calcParams.selectedIngId) &&
               String(item.availableAmt) === String(calcParams.availableAmt)
          );

          const toggleFavourite = () => {
            if (!foodId || !variationId || view !== 'recipe') return;
            if (isCurrentSaved(favourites)) {
                setFavourites(prev => prev.filter(item => !(item.foodId === foodId && item.variationId === variationId && item.mode === calcMode && String(item.targetYield) === String(calcParams.targetYield) && String(item.selectedIngId) === String(calcParams.selectedIngId) && String(item.availableAmt) === String(calcParams.availableAmt))));
            } else {
                setFavourites(prev => [...prev, { id: Date.now().toString(), foodId, variationId, mode: calcMode, ...calcParams }]);
            }
          };

          const toggleQueue = () => {
            if (!foodId || !variationId || view !== 'recipe') return;
            if (isCurrentSaved(queue)) {
                setQueue(prev => prev.filter(item => !(item.foodId === foodId && item.variationId === variationId && item.mode === calcMode && String(item.targetYield) === String(calcParams.targetYield) && String(item.selectedIngId) === String(calcParams.selectedIngId) && String(item.availableAmt) === String(calcParams.availableAmt))));
            } else {
                setQueue(prev => [...prev, { id: Date.now().toString(), foodId, variationId, mode: calcMode, ...calcParams }].slice(-3));
            }
          };

          const handleLongPress = (fId, vId) => {
            setLongPressModal({ foodId: fId, variationId: vId });
          };

          const addToGenericSaved = (listType) => {
            if (!longPressModal) return;
            const newItem = { id: Date.now().toString(), foodId: longPressModal.foodId, variationId: longPressModal.variationId, mode: null, targetYield: null, selectedIngId: null, availableAmt: null };
            if (listType === 'fav') {
                setFavourites(prev => [...prev, newItem]);
            } else {
                setQueue(prev => [...prev, newItem].slice(-3));
            }
            setLongPressModal(null);
            setAlertMsg("Saved successfully!");
          };

          const handleShare = () => {
             const food = appData.recipes[foodId];
             const variation = food.variations.find(v => v.id === variationId);
             const title = `${food.name} ${variation.name}`;
             if(navigator.share) {
                 navigator.share({
                     title: title,
                     text: `Check out this recipe for ${title} on Food Maker!`
                 }).catch(err => console.log('Error sharing', err));
             }
          };

          const handleCreateRecipe = ({ newRecipe, categoryId }) => {
            setAppData(prev => {
              const updatedMenu = prev.menu.map(cat => {
                if (cat.id === categoryId) {
                  let myRecipesSub = cat.subcategories.find(s => s.id === 'my-recipes');
                  if (!myRecipesSub) {
                    myRecipesSub = { id: 'my-recipes', name: 'My Recipes', foods: [] };
                    return { ...cat, subcategories: [...cat.subcategories, myRecipesSub] };
                  }
                }
                return cat;
              });

              const finalMenu = updatedMenu.map(cat => {
                 if (cat.id === categoryId) {
                    return {
                        ...cat,
                        subcategories: cat.subcategories.map(sub => {
                            if (sub.id === 'my-recipes') {
                                return { ...sub, foods: [...sub.foods, { id: newRecipe.id, name: newRecipe.name }] };
                            }
                            return sub;
                        })
                    }
                 }
                 return cat;
              });

              return {
                ...prev,
                menu: finalMenu,
                recipes: { ...prev.recipes, [newRecipe.id]: newRecipe },
                latestUpdates: [
                  { id: `new-${Date.now()}`, type: 'food', foodId: newRecipe.id, title: newRecipe.name, category: 'My Recipes', bg: 'from-green-400 to-emerald-500', icon: 'fa-utensils' },
                  ...prev.latestUpdates.slice(0, 7)
                ]
              };
            });
            setFoodId(newRecipe.id);
            setView('variations');
          };

          const handleUpdateVariation = (fId, updatedVariation) => {
            setAppData(prev => {
                const food = prev.recipes[fId];
                const updatedVariations = food.variations.map(v => v.id === updatedVariation.id ? updatedVariation : v);
                const updatedFood = { ...food, variations: updatedVariations };
                return {
                    ...prev,
                    recipes: { ...prev.recipes, [fId]: updatedFood }
                };
            });
          };

          const handleDeleteRecipe = (recipe) => {
            setAppData(prev => {
                const newRecipes = { ...prev.recipes };
                delete newRecipes[recipe.id];

                const newMenu = prev.menu.map(cat => ({
                    ...cat,
                    subcategories: cat.subcategories.map(sub => ({
                        ...sub,
                        foods: sub.foods.filter(f => f.id !== recipe.id)
                    }))
                }));

                return { ...prev, menu: newMenu, recipes: newRecipes, trash: [...(prev.trash || []), recipe] };
            });
            setView('home');
            setAlertMsg(`${recipe.name} moved to trash.`);
          };

          const handleRestoreRecipe = (recipe) => {
            setAppData(prev => {
                const catId = recipe.categoryId || 'snacks';
                const newMenu = prev.menu.map(cat => {
                    if (cat.id === catId) {
                        let myRecipesSub = cat.subcategories.find(s => s.id === 'my-recipes');
                        if (!myRecipesSub) return { ...cat, subcategories: [...cat.subcategories, { id: 'my-recipes', name: 'My Recipes', foods: [] }] };
                    }
                    return cat;
                }).map(cat => {
                    if (cat.id === catId) {
                        return { ...cat, subcategories: cat.subcategories.map(sub => sub.id === 'my-recipes' ? { ...sub, foods: [...sub.foods, { id: recipe.id, name: recipe.name }] } : sub) };
                    }
                    return cat;
                });

                return {
                    ...prev,
                    menu: newMenu,
                    recipes: { ...prev.recipes, [recipe.id]: recipe },
                    trash: prev.trash.filter(r => r.id !== recipe.id)
                };
            });
            setAlertMsg(`${recipe.name} restored.`);
          };

          const handleDeletePerm = (id) => {
            setAppData(prev => ({ ...prev, trash: prev.trash.filter(r => r.id !== id) }));
            setAlertMsg(`Recipe permanently deleted.`);
          };

          const handleImportData = (importedData) => {
            setAppData(importedData.appData);
            setFavourites(importedData.favourites);
            setQueue(importedData.queue);
            setView('home');
          };

          let headerTitle = "Food Maker";
          let headerIcon = null;
          if (view === 'variations' && foodId) headerTitle = appData.recipes[foodId]?.name;
          if (view === 'calcMode') headerTitle = "Calculation";
          if (view === 'recipe' && foodId && variationId) {
            const food = appData.recipes[foodId];
            const variation = food?.variations.find(v => v.id === variationId);
            headerTitle = `${food?.name} ${variation?.name}`;
          }
          if (view === 'favourites') { headerTitle = "My Favourites"; headerIcon = "fa-heart text-rose-500"; }
          if (view === 'queue') { headerTitle = "Up Next"; headerIcon = "fa-list-check text-amber-500"; }
          if (view === 'create') { headerTitle = "Create Recipe"; headerIcon = "fa-plus text-amber-500"; }
          if (view === 'settings') { headerTitle = "Settings & Data"; headerIcon = "fa-gear text-stone-500"; }
          if (view === 'trash') { headerTitle = "Trash"; headerIcon = "fa-trash text-stone-500"; }

          return (
            <div className="h-full w-full flex flex-col overflow-hidden selection:bg-amber-200 relative font-sans">
              <CustomAlert message={alertMsg} onClose={() => setAlertMsg(null)} />
              
              <Header 
                onMenuClick={() => setIsMenuOpen(true)} 
                onBack={goBack} 
                view={view} 
                title={headerTitle} 
                icon={headerIcon}
                isFavourite={isCurrentSaved(favourites)}
                toggleFavourite={toggleFavourite}
                isQueued={isCurrentSaved(queue)}
                toggleQueue={toggleQueue}
                onShare={handleShare}
              />
              
              <SideMenu 
                isOpen={isMenuOpen} 
                onClose={() => setIsMenuOpen(false)} 
                onSelectFood={handleSelectFood}
                onOpenFavourites={() => setView('favourites')}
                onOpenQueue={() => setView('queue')}
                onOpenCreate={() => setView('create')}
                onOpenTrash={() => setView('trash')}
                onOpenSettings={() => setView('settings')}
                menuData={appData.menu}
              />

              <main className="flex-1 overflow-hidden relative font-sans">
                {view === 'home' && <HomeView onSelectFood={handleSelectFood} latestUpdates={appData.latestUpdates} />}
                {view === 'favourites' && <FavouritesView favourites={favourites} recipes={appData.recipes} onSelectSaved={handleSelectSaved} />}
                {view === 'queue' && <UpNextView queue={queue} recipes={appData.recipes} onSelectSaved={handleSelectSaved} />}
                {view === 'create' && <CreateRecipeView onSave={handleCreateRecipe} categories={appData.menu} recipes={appData.recipes} showAlert={setAlertMsg} />}
                {view === 'settings' && <SettingsView appData={appData} favourites={favourites} queue={queue} onImport={handleImportData} setAlertMsg={setAlertMsg} />}
                {view === 'trash' && <TrashView trash={appData.trash} onRestore={handleRestoreRecipe} onDeletePerm={handleDeletePerm} />}
                {view === 'variations' && <VariationsView food={appData.recipes[foodId]} onSelectVariation={handleSelectVariation} onLongPress={handleLongPress} onDeleteRecipe={handleDeleteRecipe} />}
                {view === 'calcMode' && <CalcModeView onSelectMode={handleSelectMode} />}
                {view === 'recipe' && (
                  <RecipeView 
                    variation={appData.recipes[foodId].variations.find(v => v.id === variationId)} 
                    mode={calcMode}
                    calcParams={calcParams}
                    setCalcParams={setCalcParams}
                    onUpdateVariation={(updatedVar) => handleUpdateVariation(foodId, updatedVar)}
                  />
                )}
              </main>

              {longPressModal && (
                <div className="fixed inset-0 bg-stone-900/60 z-[60] flex items-end justify-center sm:items-center p-4 animate-in fade-in font-sans" onClick={() => setLongPressModal(null)}>
                   <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl transform transition-transform animate-in slide-in-from-bottom-4 font-sans" onClick={e => e.stopPropagation()}>
                      <h3 className="font-display font-bold text-xl text-stone-800 mb-4">Quick Save</h3>
                      <div className="space-y-3 font-sans">
                         <button onClick={() => addToGenericSaved('fav')} className="w-full bg-rose-50 text-rose-600 font-sans font-bold p-4 rounded-2xl flex items-center gap-3 active:scale-95 transition-transform font-sans">
                            <i className="fa-solid fa-heart text-2xl"></i> My Favourites
                         </button>
                         <button onClick={() => addToGenericSaved('queue')} className="w-full bg-amber-50 text-amber-600 font-sans font-bold p-4 rounded-2xl flex items-center gap-3 active:scale-95 transition-transform font-sans">
                            <i className="fa-solid fa-list-check text-2xl"></i> Up Next
                         </button>
                      </div>
                   </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
          <ErrorBoundary>
            <App />
          </ErrorBoundary>
        );
    </script>
</body>
</html>
