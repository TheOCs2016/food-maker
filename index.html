    <!-- Global Error Handler for Debugging Blank Screens -->
    <script>
        window.addEventListener('error', function(e) {
            const root = document.getElementById('root');
            if (root && root.innerHTML.includes('Loading')) {
                const isSyntax = (e.message || '').toLowerCase().includes('script error') || (e.message || '').toLowerCase().includes('syntax') || (e.message || '').toLowerCase().includes('token');
                root.innerHTML = '<div style="padding: 2rem; text-align: center; font-family: sans-serif; color: #b91c1c;">' +
                                 '<i class="fa-solid fa-triangle-exclamation" style="font-size: 3rem; margin-bottom: 1rem;"></i>' +
                                 '<h2 style="font-weight: bold; margin-bottom: 1rem; font-size: 1.5rem;">Failed to Load App</h2>' +
                                 '<p style="color: #4b5563; font-size: 0.9rem; margin-bottom: 2rem;">' + (isSyntax ? 'Code Syntax Error. Please check the code for missing brackets or commas.' : (e.message || 'Unknown network or syntax error.')) + '</p>' +
                                 '<button onclick="localStorage.clear(); window.location.reload();" style="padding: 1rem 2rem; background: #1c1917; color: white; border-radius: 0.5rem; border: none; font-weight: bold; cursor: pointer;">Reset App Data</button>' +
                                 '</div>';
            }
        });
    </script>

    <script type="text/babel">

        class ErrorBoundary extends React.Component {
          constructor(props) {
            super(props);
            this.state = { hasError: false };
          }
          static getDerivedStateFromError(error) { return { hasError: true }; }
          componentDidCatch(error, errorInfo) { console.error("Food Maker caught an error:", error, errorInfo); }
          render() {
            if (this.state.hasError) {
              return (
                <div className="h-full w-full flex flex-col items-center justify-center p-6 text-center bg-[#FAF8F5] font-sans">
                  <i className="fa-solid fa-triangle-exclamation text-5xl text-rose-400 mb-4"></i>
                  <h2 className="text-2xl font-display font-extrabold text-stone-800 mb-2">Oops! Something broke.</h2>
                  <p className="font-sans text-stone-500 mb-8 max-w-xs">The app encountered a rendering error. This usually happens if the local save data was corrupted.</p>
                  <button 
                    onClick={() => { localStorage.clear(); window.location.reload(); }}
                    className="bg-stone-900 text-white font-display font-bold px-6 py-4 rounded-xl shadow-md active:scale-95 transition-transform"
                  >
                    Reset App & Reload
                  </button>
                </div>
              );
            }
            return this.props.children;
          }
        }

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'food-maker-backup.json';
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (imported.appData && imported.favourites && imported.queue) {
                            onImport(imported);
                            setAlertMsg("Data imported successfully!");
                        } else {
                            setAlertMsg("Invalid backup file.");
                        }
                    } catch (error) {
                        setAlertMsg("Error reading file.");
                    }
                };
                reader.readAsText(file);

        const RecipeView = ({ variation, mode, calcParams, setCalcParams, onUpdateVariation }) => {
          const [draggedId, setDraggedId] = useState(null);
          const [dragOverId, setDragOverId] = useState(null);
          const [checkedIngs, setCheckedIngs] = useState({});

          useEffect(() => setCheckedIngs({}), [variation?.id]);

          useEffect(() => {
            if (mode === 'specific' && calcParams.targetYield === null) {
              setCalcParams(prev => ({ ...prev, targetYield: variation.baseYield }));
            } else if (mode === 'availability' && calcParams.selectedIngId === null) {
              setCalcParams(prev => ({ ...prev, selectedIngId: variation.ingredients[0].id, availableAmt: variation.ingredients[0].baseAmount }));
            }
          }, [mode, variation, calcParams.targetYield, calcParams.selectedIngId, setCalcParams]);

          const displayTargetYield = calcParams.targetYield !== null ? calcParams.targetYield : variation.baseYield;
          const displaySelectedIngId = calcParams.selectedIngId !== null ? calcParams.selectedIngId : variation.ingredients[0].id;
          const displayAvailableAmt = calcParams.availableAmt !== null ? calcParams.availableAmt : variation.ingredients[0].baseAmount;

          let multiplier = 1;
          let estimatedYield = variation.baseYield;

          if (mode === 'specific') {
            const parsedYield = parseFloat(displayTargetYield) || 0;
            multiplier = parsedYield / variation.baseYield;
            estimatedYield = parsedYield;
          } else {
            const baseIng = variation.ingredients.find(i => i.id === displaySelectedIngId);
            const parsedAmt = parseFloat(displayAvailableAmt) || 0;
            if(baseIng) multiplier = parsedAmt / baseIng.baseAmount;
            estimatedYield = variation.baseYield * multiplier;
          }

          const formatAmount = (ing) => {
            const calcMetric = ing.baseAmount * multiplier;
            const calcVol = ing.volAmount ? ing.volAmount * multiplier : null;
            let metricStr = isNaN(calcMetric) || calcMetric === 0 ? "0" : 
                (ing.unit === 'units' || ing.unit === 'cm' || ing.unit === 'slices' || ing.unit === 'pieces' || ing.unit === 'handful' ? calcMetric.toFixed(1).replace('.0', '') : Math.round(calcMetric).toString());
            let volStr = calcVol ? parseFloat(calcVol.toFixed(2)).toString() : null;
            return { metricVal: metricStr, metricUnit: ing.unit, volVal: volStr, volUnit: ing.volUnit };
          };

          const handleDragStart = (e, id) => {
             e.dataTransfer.setData('text/plain', id);
             e.dataTransfer.effectAllowed = 'move';
             setDraggedId(id);
          };

          const handleDragOver = (e, id) => {
             e.preventDefault();
             e.dataTransfer.dropEffect = 'move';
             if (id !== dragOverId) setDragOverId(id);
          };

          const handleDragEnd = () => { setDraggedId(null); setDragOverId(null); };

          const handleDrop = (e, targetId) => {
             e.preventDefault();
             const sourceId = e.dataTransfer.getData('text/plain');
             if (sourceId && sourceId !== targetId) {
                 const sourceIdx = variation.ingredients.findIndex(i => i.id === sourceId);
                 const targetIdx = variation.ingredients.findIndex(i => i.id === targetId);
                 if (sourceIdx > -1 && targetIdx > -1) {
                     const targetGroup = variation.ingredients[targetIdx].group || '';
                     const newIngs = [...variation.ingredients];
                     const [moved] = newIngs.splice(sourceIdx, 1);
                     moved.group = targetGroup;
                     newIngs.splice(targetIdx, 0, moved);
                     onUpdateVariation({ ...variation, ingredients: newIngs });
                 }
             }
             setDraggedId(null); setDragOverId(null);
          };

          const toggleIngredient = (id) => setCheckedIngs(prev => ({ ...prev, [id]: !prev[id] }));

          const ingredientGroups = {};
          const checkedList = [];
          variation.ingredients.forEach(ing => {
            if (checkedIngs[ing.id]) checkedList.push(ing);
            else {
                const groupName = ing.group || 'Ingredients';
                if (!ingredientGroups[groupName]) ingredientGroups[groupName] = [];
                ingredientGroups[groupName].push(ing);
            }
          });

          const renderIngredientRow = (ing, isChecked) => {
            const formatted = formatAmount(ing);
            return (
              <li 
                key={ing.id} draggable="true" onDragStart={(e) => handleDragStart(e, ing.id)} onDragOver={(e) => handleDragOver(e, ing.id)} onDrop={(e) => handleDrop(e, ing.id)} onDragEnd={handleDragEnd}
                className={`flex items-stretch hover:bg-stone-50 transition-colors font-sans 
                  ${draggedId === ing.id ? 'opacity-40 bg-stone-100' : ''} 
                  ${dragOverId === ing.id && draggedId !== ing.id ? 'border-t-2 border-amber-400 bg-amber-50' : ''}
                  ${isChecked ? 'bg-stone-50/60' : ''}`}
              >
                <div className="pl-4 py-4 flex items-center justify-center touch-none cursor-move">
                    <i className="fa-solid fa-grip-vertical text-stone-300 hover:text-stone-400 active:text-stone-500 px-2 py-1"></i>
                </div>
                <div className="flex-1 p-4 pl-2 flex items-center justify-between cursor-pointer touch-action-manipulation" onClick={() => toggleIngredient(ing.id)}>
                   <div className="flex items-center gap-3">
                       {isChecked ? <i className="fa-solid fa-circle-check text-stone-400 text-[1.2rem]"></i> : <i className="fa-regular fa-circle text-stone-300 text-[1.2rem]"></i>}
                       <span className={`font-sans font-medium text-[0.95rem] leading-relaxed pr-2 transition-all ${isChecked ? 'text-stone-400 line-through' : 'text-stone-700'}`}>{ing.name}</span>
                   </div>
                   <div className="text-right shrink-0 ml-4 flex flex-col items-end font-sans transition-all">
                       <div className={`font-sans font-bold text-[0.95rem] ${isChecked ? 'text-stone-400' : 'text-stone-800'}`}>
                         {formatted.metricVal} <span className={`font-medium ${isChecked ? 'text-stone-400' : 'text-stone-600'}`}>{formatted.metricUnit}</span>
                       </div>
                       {formatted.volVal && <div className={`font-sans text-xs font-medium mt-0.5 ${isChecked ? 'text-stone-300' : 'text-stone-400'}`}>{formatted.volVal} {formatted.volUnit}</div>}
                   </div>
                </div>
              </li>
            );
          };

          return (
            <div className="h-full p-4 overflow-y-auto pb-24 scroll-smooth">
              {mode === 'specific' ? (
                <div className="bg-white p-6 rounded-[1.25rem] shadow-sm border border-stone-200 mb-8 pl-10">
                  <label className="block text-[0.7rem] font-sans font-bold text-stone-500 mb-2 uppercase tracking-wide">
                    How many {variation.yieldUnit} do you want?
                  </label>
                  <div className="flex items-end gap-3 pl-4">
                    <input 
                      type="number" min="0" value={displayTargetYield} 
                      onChange={e => setCalcParams(prev => ({ ...prev, targetYield: e.target.value }))} 
                      className="w-full text-4xl font-display font-extrabold text-stone-800 bg-transparent border-b-2 border-stone-200 focus:border-stone-400 outline-none pb-2 transition-colors pl-2" 
                    />
                    <span className="text-base font-sans font-bold text-stone-400 pb-2">{variation.yieldUnit}</span>
                  </div>
                </div>
              ) : (
                <div className="bg-white p-6 rounded-[1.25rem] shadow-sm border border-stone-200 mb-8 flex flex-col gap-6 relative overflow-hidden pl-10">
                  <div className="absolute top-0 left-0 w-1.5 h-full bg-stone-800"></div>
                  <div>
                    <label className="block text-[0.7rem] font-sans font-bold text-stone-500 mb-2 uppercase tracking-wide">Base ingredient</label>
                    <div className="pl-4">
                        <select 
                          value={displaySelectedIngId} 
                          onChange={e => {
                            const newBaseIng = variation.ingredients.find(i => i.id === e.target.value);
                            setCalcParams(prev => ({ ...prev, selectedIngId: e.target.value, availableAmt: newBaseIng.baseAmount }));
                          }} 
                          className="w-full text-base font-sans font-bold text-stone-800 bg-transparent border-b-2 border-stone-200 focus:border-stone-400 outline-none pb-2 cursor-pointer pl-1"
                        >
                          {variation.ingredients.map(ing => <option key={ing.id} value={ing.id}>{ing.name}</option>)}
                        </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-[0.7rem] font-sans font-bold text-stone-500 mb-2 uppercase tracking-wide">Available amount</label>
                    <div className="flex items-end gap-3 pl-4">
                      <input 
                        type="number" min="0" value={displayAvailableAmt} 
                        onChange={e => setCalcParams(prev => ({ ...prev, availableAmt: e.target.value }))} 
                        className="w-full text-4xl font-display font-extrabold text-stone-800 bg-transparent border-b-2 border-stone-200 focus:border-stone-400 outline-none pb-2 transition-colors pl-2" 
                      />
                      <span className="text-base font-sans font-bold text-stone-400 pb-2">
                        {variation.ingredients.find(i => i.id === displaySelectedIngId)?.unit || ''}
                      </span>
                    </div>
                  </div>
                  <div className="bg-stone-50 border border-stone-100 text-stone-800 p-4 rounded-xl flex items-center justify-between mt-2 shadow-sm ml-[-0.5rem]">
                    <span className="font-sans font-semibold text-sm">Estimated yield:</span>
                    <span className="font-display font-extrabold text-lg">{Math.round(estimatedYield || 0)} {variation.yieldUnit}</span>
                  </div>
                </div>
              )}
              
              <h3 className="text-xl font-display font-extrabold text-stone-800 tracking-tight mb-4">Ingredients</h3>
              <div className="bg-white rounded-[1.25rem] shadow-sm border border-stone-200 overflow-hidden mb-8">
                {Object.entries(ingredientGroups).map(([groupName, ings], gIdx) => (
                  <React.Fragment key={gIdx}>
                    {(Object.keys(ingredientGroups).length > 1 || groupName !== 'Ingredients') && (
                      <div className="bg-stone-50 px-4 py-2.5 border-y border-stone-200 first:border-t-0 flex items-center">
                        <span className="font-sans font-bold text-stone-500 text-xs uppercase tracking-wider">{groupName}</span>
                      </div>
                    )}
                    <ul className="divide-y divide-stone-100 font-sans">
                      {ings?.map(ing => renderIngredientRow(ing, false))}
                    </ul>
                  </React.Fragment>
                ))}

                {checkedList.length > 0 && (
                  <React.Fragment>
                     <div className="bg-stone-100 px-4 py-2.5 border-y border-stone-200 flex items-center">
                       <span className="font-sans font-bold text-stone-400 text-xs uppercase tracking-wider">Checked</span>
                     </div>
                     <ul className="divide-y divide-stone-100 font-sans">
                       {checkedList.map(ing => renderIngredientRow(ing, true))}
                     </ul>
                  </React.Fragment>
                )}
              </div>

              <h3 className="text-xl font-display font-extrabold text-stone-800 tracking-tight mb-5">Instructions</h3>
              <div className="space-y-5">
                {variation?.steps?.map((step, index) => (
                  <div key={index} className="flex gap-3 items-start">
                    <div className="w-7 h-7 rounded-full bg-stone-800 text-white flex items-center justify-center font-sans font-bold shrink-0 mt-0.5 shadow-sm text-sm">
                      {index + 1}
                    </div>
                    <p className="font-sans text-stone-700 font-normal leading-relaxed pt-0.5 text-[0.95rem]">{step}</p>
                  </div>
                ))}
              </div>

              {variation?.notes && variation.notes.length > 0 && (
                <div className="mt-8 pt-8 border-t border-stone-200">
                  <h3 className="text-xl font-display font-extrabold text-stone-800 tracking-tight mb-4">Notes</h3>
                  <ul className="list-disc pl-5 space-y-2 text-stone-600 font-sans text-[0.95rem] leading-relaxed">
                    {variation.notes.map((note, i) => <li key={i} dangerouslySetInnerHTML={{ __html: note }} />)}
                  </ul>
                </div>
              )}

              {variation?.source && (
                <div className="mt-8 text-sm text-stone-500 font-sans bg-stone-100 p-4 rounded-xl flex flex-col gap-1">
                  <span className="font-bold font-sans text-stone-700">Source: </span>
                  {variation.source.startsWith('http') ? (
                    <a href={variation.source} target="_blank" className="text-stone-600 hover:text-stone-800 underline break-all font-sans">{variation.source}</a>
                  ) : (
                    <span className="font-sans">{variation.source}</span>
                  )}
                </div>
              )}
            </div>
          );
        };

        const App = () => {
          const [appData, setAppData] = useState(() => {
            try {
                const saved = localStorage.getItem('foodMakerAppData');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    // Core menu & recipes are always source of truth
                    const mergedMenu = defaultMenu.map(initialCat => {
                       const savedCat = parsed.menu?.find(c => c.id === initialCat.id);
                       if (savedCat) {
                           const myRecipesSub = savedCat.subcategories?.find(s => s.id === 'my-recipes');
                           if (myRecipesSub) return { ...initialCat, subcategories: [...initialCat.subcategories, myRecipesSub] };
                       }
                       return initialCat;
                    });
                    const mergedRecipes = { ...defaultRecipes };
                    if (parsed.recipes) {
                        Object.keys(parsed.recipes).forEach(key => {
                            if (parsed.recipes[key].isCustom) mergedRecipes[key] = parsed.recipes[key];
                            else if (parsed.recipes[key] && !parsed.recipes[key].isCustom) {
                                if (mergedRecipes[key] && mergedRecipes[key].variations) {
                                    mergedRecipes[key].variations = mergedRecipes[key].variations.map(initialVar => {
                                        const savedVar = parsed.recipes[key].variations.find(v => v.id === initialVar.id);
                                        if (savedVar && savedVar.ingredients) return { ...initialVar, ingredients: savedVar.ingredients };
                                        return initialVar;
                                    });
                                }
                            }
                        });
                    }
                    return { recipes: mergedRecipes, menu: mergedMenu, latestUpdates: defaultDiscover, trash: parsed.trash || [] };
                }
            } catch (error) { console.error("Failed to parse Local Storage", error); }
            return { menu: defaultMenu, recipes: defaultRecipes, latestUpdates: defaultDiscover, trash: [] };
          });
          
          const [favourites, setFavourites] = useState(() => { try { return JSON.parse(localStorage.getItem('foodMakerFavs')) || []; } catch(e) { return []; } }); 
          const [queue, setQueue] = useState(() => { try { return JSON.parse(localStorage.getItem('foodMakerQueue')) || []; } catch(e) { return []; } }); 

          useEffect(() => localStorage.setItem('foodMakerAppData', JSON.stringify(appData)), [appData]);
          useEffect(() => localStorage.setItem('foodMakerFavs', JSON.stringify(favourites)), [favourites]);
          useEffect(() => localStorage.setItem('foodMakerQueue', JSON.stringify(queue)), [queue]);

          const [view, setView] = useState('home'); 
          const [foodId, setFoodId] = useState(null);
          const [variationId, setVariationId] = useState(null);
          const [calcMode, setCalcMode] = useState(null);
          const [isMenuOpen, setIsMenuOpen] = useState(false);
          const [alertMsg, setAlertMsg] = useState(null);
          const [calcParams, setCalcParams] = useState({ targetYield: null, selectedIngId: null, availableAmt: null });
          const [longPressModal, setLongPressModal] = useState(null);

          const handleSelectFood = (id) => { setFoodId(id); setView('variations'); };
          const handleSelectVariation = (id) => { setVariationId(id); setCalcParams({ targetYield: null, selectedIngId: null, availableAmt: null }); setView('calcMode'); };
          const handleSelectMode = (mode) => { setCalcMode(mode); setView('recipe'); };
          const handleSelectSaved = (savedItem) => {
            setFoodId(savedItem.foodId); setVariationId(savedItem.variationId);
            if (savedItem.mode) { setCalcMode(savedItem.mode); setCalcParams({ targetYield: savedItem.targetYield, selectedIngId: savedItem.selectedIngId, availableAmt: savedItem.availableAmt }); setView('recipe'); } 
            else { setCalcParams({ targetYield: null, selectedIngId: null, availableAmt: null }); setView('calcMode'); }
          };

          const goBack = () => {
            if (view === 'recipe') setView('calcMode');
            else if (view === 'calcMode') setView('variations');
            else if (view === 'variations') { setView('home'); setFoodId(null); }
            else if (['favourites', 'queue', 'create', 'settings', 'trash'].includes(view)) setView('home');
          };

          const isCurrentSaved = (list) => list.some(item => item.foodId === foodId && item.variationId === variationId && item.mode === calcMode && String(item.targetYield) === String(calcParams.targetYield) && String(item.selectedIngId) === String(calcParams.selectedIngId) && String(item.availableAmt) === String(calcParams.availableAmt));
          const toggleFavourite = () => {
            if (!foodId || !variationId || view !== 'recipe') return;
            if (isCurrentSaved(favourites)) setFavourites(prev => prev.filter(item => !(item.foodId === foodId && item.variationId === variationId && item.mode === calcMode && String(item.targetYield) === String(calcParams.targetYield) && String(item.selectedIngId) === String(calcParams.selectedIngId) && String(item.availableAmt) === String(calcParams.availableAmt))));
            else setFavourites(prev => [...prev, { id: Date.now().toString(), foodId, variationId, mode: calcMode, ...calcParams }]);
          };
          const toggleQueue = () => {
            if (!foodId || !variationId || view !== 'recipe') return;
            if (isCurrentSaved(queue)) setQueue(prev => prev.filter(item => !(item.foodId === foodId && item.variationId === variationId && item.mode === calcMode && String(item.targetYield) === String(calcParams.targetYield) && String(item.selectedIngId) === String(calcParams.selectedIngId) && String(item.availableAmt) === String(calcParams.availableAmt))));
            else setQueue(prev => [...prev, { id: Date.now().toString(), foodId, variationId, mode: calcMode, ...calcParams }].slice(-3));
          };

          const handleLongPress = (fId, vId) => setLongPressModal({ foodId: fId, variationId: vId });
          const addToGenericSaved = (listType) => {
            if (!longPressModal) return;
            const newItem = { id: Date.now().toString(), foodId: longPressModal.foodId, variationId: longPressModal.variationId, mode: null, targetYield: null, selectedIngId: null, availableAmt: null };
            if (listType === 'fav') setFavourites(prev => [...prev, newItem]);
            else setQueue(prev => [...prev, newItem].slice(-3));
            setLongPressModal(null); setAlertMsg("Saved successfully!");
          };

          const handleShare = () => {
             const food = appData.recipes[foodId]; const variation = food.variations.find(v => v.id === variationId);
             const title = `${food.name} ${variation.name}`;
             if(navigator.share) navigator.share({ title: title, text: `Check out this recipe for ${title} on Food Maker!` }).catch(err => console.log('Error sharing', err));
          };

          const handleCreateRecipe = ({ newRecipe, categoryId }) => {
            setAppData(prev => {
              const finalMenu = prev.menu.map(cat => {
                 if (cat.id === categoryId) {
                    let subcats = [...cat.subcategories];
                    let myRecs = subcats.find(s => s.id === 'my-recipes');
                    if (!myRecs) { myRecs = { id: 'my-recipes', name: 'My Recipes', foods: [] }; subcats.push(myRecs); }
                    else { subcats = subcats.map(s => s.id === 'my-recipes' ? { ...s, foods: [...s.foods, { id: newRecipe.id, name: newRecipe.name }] } : s); }
                    return { ...cat, subcategories: subcats };
                 }
                 return cat;
              });
              return { ...prev, menu: finalMenu, recipes: { ...prev.recipes, [newRecipe.id]: newRecipe } };
            });
            setFoodId(newRecipe.id); setView('variations');
          };

          const handleUpdateVariation = (fId, updatedVariation) => {
            setAppData(prev => {
                const food = prev.recipes[fId];
                const updatedVariations = food.variations.map(v => v.id === updatedVariation.id ? updatedVariation : v);
                return { ...prev, recipes: { ...prev.recipes, [fId]: { ...food, variations: updatedVariations } } };
            });
          };

          const handleDeleteRecipe = (recipe) => {
            setAppData(prev => {
                const newRecipes = { ...prev.recipes }; delete newRecipes[recipe.id];
                const newMenu = prev.menu.map(cat => ({ ...cat, subcategories: cat.subcategories.map(sub => ({ ...sub, foods: sub.foods.filter(f => f.id !== recipe.id) })) }));
                return { ...prev, menu: newMenu, recipes: newRecipes, trash: [...(prev.trash || []), recipe] };
            });
            setView('home'); setAlertMsg(`${recipe.name} moved to trash.`);
          };

          const handleRestoreRecipe = (recipe) => {
            setAppData(prev => {
                const catId = recipe.categoryId || 'snacks';
                const newMenu = prev.menu.map(cat => {
                    if (cat.id === catId) {
                        let subcats = [...cat.subcategories]; let myRecs = subcats.find(s => s.id === 'my-recipes');
                        if (!myRecs) { subcats.push({ id: 'my-recipes', name: 'My Recipes', foods: [{ id: recipe.id, name: recipe.name }] }); }
                        else { subcats = subcats.map(s => s.id === 'my-recipes' ? { ...s, foods: [...s.foods, { id: recipe.id, name: recipe.name }] } : s); }
                        return { ...cat, subcategories: subcats };
                    }
                    return cat;
                });
                return { ...prev, menu: newMenu, recipes: { ...prev.recipes, [recipe.id]: recipe }, trash: prev.trash.filter(r => r.id !== recipe.id) };
            });
            setAlertMsg(`${recipe.name} restored.`);
          };

          const handleDeletePerm = (id) => { setAppData(prev => ({ ...prev, trash: prev.trash.filter(r => r.id !== id) })); setAlertMsg(`Recipe permanently deleted.`); };
          const handleImportData = (importedData) => { setAppData(importedData.appData); setFavourites(importedData.favourites); setQueue(importedData.queue); setView('home'); };

          const handleOpenSearch = () => {
            setIsMenuOpen(true);
            setTimeout(() => {
              const searchInput = document.getElementById('menu-search');
              if (searchInput) searchInput.focus();
            }, 300);
          };

          let headerTitle = "Food Maker"; let headerIcon = null;
          if (view === 'variations' && foodId) headerTitle = appData.recipes[foodId]?.name;
          if (view === 'calcMode') headerTitle = "Calculation";
          if (view === 'recipe' && foodId && variationId) { const food = appData.recipes[foodId]; const variation = food?.variations.find(v => v.id === variationId); headerTitle = `${food?.name} ${variation?.name}`; }
          if (view === 'favourites') { headerTitle = "My Favourites"; headerIcon = "fa-heart text-rose-500"; }
          if (view === 'queue') { headerTitle = "Up Next"; headerIcon = "fa-list-check text-amber-500"; }
          if (view === 'create') { headerTitle = "Create Recipe"; headerIcon = "fa-plus text-stone-800"; }
          if (view === 'settings') { headerTitle = "Settings & Data"; headerIcon = "fa-gear text-stone-800"; }
          if (view === 'trash') { headerTitle = "Trash"; headerIcon = "fa-trash text-stone-800"; }

          return (
            <div className="h-full w-full flex flex-col overflow-hidden selection:bg-amber-200 relative">
              <CustomAlert message={alertMsg} onClose={() => setAlertMsg(null)} />
              
              <Header 
                onMenuClick={() => setIsMenuOpen(true)} onBack={goBack} view={view} title={headerTitle} icon={headerIcon}
                isFavourite={isCurrentSaved(favourites)} toggleFavourite={toggleFavourite} isQueued={isCurrentSaved(queue)} toggleQueue={toggleQueue} onShare={handleShare} onSearchClick={handleOpenSearch}
              />
              
              <SideMenu 
                isOpen={isMenuOpen} onClose={() => setIsMenuOpen(false)} onSelectFood={handleSelectFood} onOpenFavourites={() => setView('favourites')}
                onOpenQueue={() => setView('queue')} onOpenCreate={() => setView('create')} onOpenTrash={() => setView('trash')} onOpenSettings={() => setView('settings')}
                menuData={appData.menu}
              />

              <main className="flex-1 overflow-hidden relative">
                {view === 'home' && <HomeView onSelectFood={handleSelectFood} latestUpdates={appData.latestUpdates} menu={appData.menu} />}
                {view === 'favourites' && <FavouritesView favourites={favourites} recipes={appData.recipes} onSelectSaved={handleSelectSaved} />}
                {view === 'queue' && <UpNextView queue={queue} recipes={appData.recipes} onSelectSaved={handleSelectSaved} />}
                {view === 'create' && <CreateRecipeView onSave={handleCreateRecipe} categories={appData.menu} recipes={appData.recipes} showAlert={setAlertMsg} />}
                {view === 'settings' && <SettingsView appData={appData} favourites={favourites} queue={queue} onImport={handleImportData} setAlertMsg={setAlertMsg} />}
                {view === 'trash' && <TrashView trash={appData.trash} onRestore={handleRestoreRecipe} onDeletePerm={handleDeletePerm} />}
                {view === 'variations' && <VariationsView food={appData.recipes[foodId]} onSelectVariation={handleSelectVariation} onLongPress={handleLongPress} onDeleteRecipe={handleDeleteRecipe} />}
                {view === 'calcMode' && <CalcModeView onSelectMode={handleSelectMode} />}
                {view === 'recipe' && (
                  <RecipeView variation={appData.recipes[foodId].variations.find(v => v.id === variationId)} mode={calcMode} calcParams={calcParams} setCalcParams={setCalcParams} onUpdateVariation={(updatedVar) => handleUpdateVariation(foodId, updatedVar)} />
                )}
              </main>

              {longPressModal && (
                <div className="fixed inset-0 bg-stone-900/60 z-[60] flex items-end justify-center sm:items-center p-4 animate-in fade-in" onClick={() => setLongPressModal(null)}>
                   <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl transform transition-transform animate-in slide-in-from-bottom-4" onClick={e => e.stopPropagation()}>
                      <h3 className="font-display font-bold text-xl text-stone-800 mb-4">Quick Save</h3>
                      <div className="space-y-3 font-sans">
                         <button onClick={() => addToGenericSaved('fav')} className="w-full bg-rose-50 text-rose-600 font-sans font-bold p-4 rounded-2xl flex items-center gap-3 active:scale-95 transition-transform">
                            <i className="fa-solid fa-heart text-2xl"></i> My Favourites
                         </button>
                         <button onClick={() => addToGenericSaved('queue')} className="w-full bg-amber-50 text-amber-600 font-sans font-bold p-4 rounded-2xl flex items-center gap-3 active:scale-95 transition-transform">
                            <i className="fa-solid fa-list-check text-2xl"></i> Up Next
                         </button>
                      </div>
                   </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
