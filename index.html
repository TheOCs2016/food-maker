    <script>
        window.addEventListener('error', function(e) {
            const root = document.getElementById('root');
            if (root && root.innerHTML.includes('Loading')) {
                const isSyntax = (e.message || '').toLowerCase().includes('script error') || (e.message || '').toLowerCase().includes('syntax');
                root.innerHTML = '<div style="padding: 2rem; text-align: center; font-family: sans-serif; color: #b91c1c;">' +
                                 '<i class="fa-solid fa-triangle-exclamation" style="font-size: 3rem; margin-bottom: 1rem;"></i>' +
                                 '<h2 style="font-weight: bold; margin-bottom: 1rem; font-size: 1.5rem;">Failed to Load App</h2>' +
                                 '<p style="color: #4b5563; font-size: 0.9rem; margin-bottom: 2rem;">' + (isSyntax ? 'Code Syntax Error. Please check the code for missing brackets or commas.' : (e.message || 'Unknown error.')) + '</p>' +
                                 '<button onclick="localStorage.clear(); window.location.reload();" style="padding: 1rem 2rem; background: #1c1917; color: white; border-radius: 0.5rem; border: none; font-weight: bold; cursor: pointer;">Reset App Data</button>' +
                                 '</div>';
            }
        });
    </script>

        const SwipeableItem = ({ children, onDelete }) => {
            const [offset, setOffset] = useState(0);
            const touchStartX = useRef(null);

            const handleTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
            const handleTouchMove = (e) => {
                if (touchStartX.current === null) return;
                const diff = e.touches[0].clientX - touchStartX.current;
                if (diff < 0) setOffset(Math.max(diff, -100)); else setOffset(0);
            };
            const handleTouchEnd = () => {
                if (offset < -60) { onDelete(); setOffset(0); } else { setOffset(0); }
                touchStartX.current = null;
            };

            return (
                <div className="relative w-full rounded-[1.25rem] bg-rose-500 overflow-hidden shadow-sm">
                    <div className="absolute inset-y-0 right-0 w-[80px] flex items-center justify-center text-white">
                        <i className="fa-solid fa-trash text-xl"></i>
                    </div>
                    <div
                        onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd}
                        style={{ transform: `translateX(${offset}px)`, transition: touchStartX.current === null ? 'transform 0.2s' : 'none' }}
                        className="relative z-10 w-full h-full rounded-[1.25rem] bg-transparent"
                    >
                        {children}
                    </div>
                </div>
            );
        };

        const SideMenu = ({ isOpen, onClose, onSelectFood, onOpenFavourites, onOpenQueue, onOpenCreate, onOpenTrash, menuData, recipes }) => {
          const [searchTerm, setSearchTerm] = useState('');
          const [navStack, setNavStack] = useState(['main']); 
          const [selectedMenuCat, setSelectedMenuCat] = useState(null); 
          const [selectedMenuSubCat, setSelectedMenuSubCat] = useState(null); 

          useEffect(() => {
            if (!isOpen) setTimeout(() => { setSearchTerm(''); setNavStack(['main']); setSelectedMenuCat(null); setSelectedMenuSubCat(null); }, 300);
          }, [isOpen]);

          const flatFoods = React.useMemo(() => {
              const foods = [];
              menuData.forEach(cat => {
                  cat.subcategories?.forEach(sub => {
                      sub.foods?.forEach(food => { 
                          const recipeData = recipes[food.id];
                          const allIngredients = recipeData?.variations?.flatMap(v => v.ingredients.map(i => i.name)).join(' ') || '';
                          foods.push({

              return foods;
          }, [menuData, recipes]);

          const filteredFoods = searchTerm ? flatFoods.filter(f => f.searchIndex.includes(searchTerm.toLowerCase())) : [];
          
          const handleBack = () => {
              const newStack = [...navStack];
              newStack.pop();

              if (newStack[newStack.length - 1] === 'category') { setSelectedMenuSubCat(null); }

                  <div className="relative">
                    <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-stone-400"></i>
                    <input id="menu-search" type="text" placeholder="Search recipes..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full bg-stone-100 border border-stone-200 text-stone-700 rounded-lg py-1.5 pl-10 pr-4 outline-none focus:ring-2 focus:ring-amber-300 font-sans text-[0.95rem] font-medium transition-shadow" />
                  </div>
                </div>

                <div className="flex-1 overflow-hidden relative bg-white">
                    {searchTerm && (
                        <div className="absolute inset-0 z-20 overflow-y-auto py-2 font-sans space-y-0.5 bg-white">

                                   <i className={`fa-solid ${food.iconClass} w-5 h-5 flex items-center justify-center text-[1.1rem] text-amber-500`}></i>
                                   <div className="flex-1">
                                       <div className="font-sans font-semibold text-stone-700 text-[1rem]">{food.name}</div>
                                       <div className="font-sans text-stone-400 text-[0.8rem]">{food.catName} • {food.subName}</div>

                                   <i className="fa-solid fa-chevron-right text-xs text-stone-300"></i>
                               </button>
                           )) : (
                               <div className="px-6 py-4 text-stone-500 font-sans text-sm">No recipes found.</div>
                           )}
                        </div>
                    )}

                    <div className={`absolute inset-0 overflow-y-auto py-2 font-sans transition-transform duration-300 bg-white ${navStack[navStack.length-1] === 'main' && !searchTerm ? 'translate-x-0' : '-translate-x-full'}`}>
                      <button onClick={() => { onOpenFavourites(); onClose(); }} className="w-full flex items-center gap-3 px-6 py-2 hover:bg-stone-50 active:bg-stone-100 transition-colors text-left group">
                        <i className="fa-solid fa-heart w-5 h-5 flex items-center justify-center text-stone-400 group-hover:text-rose-500 transition-colors"></i>
                        <span className="font-sans font-semibold text-stone-700 text-[1rem] flex-1">My Favourites</span>
                      </button>
                      
                      <button onClick={() => { onOpenQueue(); onClose(); }} className="w-full flex items-center gap-3 px-6 py-2 hover:bg-stone-50 active:bg-stone-100 transition-colors text-left group">
                        <i className="fa-solid fa-list-check w-5 h-5 flex items-center justify-center text-stone-400 group-hover:text-stone-800 transition-colors"></i>
                        <span className="font-sans font-semibold text-stone-700 text-[1rem] flex-1">Up Next</span>
                      </button>
                      
                      <button onClick={() => { onOpenCreate(); onClose(); }} className="w-full flex items-center gap-3 px-6 py-2 hover:bg-stone-50 active:bg-stone-100 transition-colors text-left group">
                        <i className="fa-solid fa-plus w-5 h-5 flex items-center justify-center text-stone-400 group-hover:text-stone-800 transition-colors"></i>
                        <span className="font-sans font-semibold text-stone-700 text-[1rem] flex-1">Create Recipe</span>
                      </button>

                      <button onClick={() => { onOpenTrash(); onClose(); }} className="w-full flex items-center gap-3 px-6 py-2 hover:bg-stone-50 active:bg-stone-100 transition-colors text-left group">

                        <span className="font-sans font-semibold text-stone-700 text-[1rem] flex-1">Trash</span>
                      </button>

                      <div className="w-full h-px bg-stone-100 my-0.5"></div>
                      <h3 className="px-6 py-1.5 text-[0.65rem] font-bold uppercase tracking-wider text-stone-400 font-sans">Categories</h3>

                      {menuData.map(cat => (

                        >
                            <div className="flex items-center gap-3">
                                <i className={`fa-solid ${categoryColors[cat.id]?.iconClass || 'fa-utensils'} w-5 h-5 flex items-center justify-center text-[1.1rem] text-amber-500`}></i>
                                <span className="font-sans font-bold text-stone-800 text-[1rem] flex-1">{cat.name}</span>

                            <i className="fa-solid fa-chevron-right text-stone-300 group-hover:text-stone-400 text-sm"></i>

                    <div className={`absolute inset-0 flex flex-col transition-transform duration-300 bg-white z-20 ${navStack[navStack.length-1] === 'subcategory' ? 'translate-x-0' : 'translate-x-full'}`}>

                        </div>

              </div>

        const HomeView = ({ onSelectFood, latestUpdates, menu, onReorderDiscover }) => {
            const [draggedIdx, setDraggedIdx] = useState(null);
            const [touchPos, setTouchPos] = useState({ x: 0, y: 0 });
            const longPressTimer = useRef(null);
            const isDragging = useRef(false);
            const touchStartPos = useRef({ x: 0, y: 0 });

            const getCategoryDetails = (catId) => {
                const cat = menu.find(c => c.id === catId);
                const colors = categoryColors[catId] || categoryColors.default;
                return { name: cat ? cat.name : '', ...colors };
            };

            useEffect(() => {
                const handleMove = (e) => {
                    if (isDragging.current) {
                        e.preventDefault(); 
                        const touch = e.touches[0];
                        setTouchPos({ x: touch.clientX, y: touch.clientY });
                    } else if (longPressTimer.current) {
                        const touch = e.touches[0];
                        const dx = touch.clientX - touchStartPos.current.x;
                        const dy = touch.clientY - touchStartPos.current.y;
                        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                            clearTimeout(longPressTimer.current);
                            longPressTimer.current = null;
                        }
                    }
                };
                document.addEventListener('touchmove', handleMove, { passive: false });
                return () => document.removeEventListener('touchmove', handleMove);
            }, []);

            const handleTouchStart = (e, idx) => {
                const touch = e.touches[0];
                touchStartPos.current = { x: touch.clientX, y: touch.clientY };
                setTouchPos({ x: touch.clientX, y: touch.clientY });
                longPressTimer.current = setTimeout(() => {
                    isDragging.current = true;
                    setDraggedIdx(idx);
                    if (navigator.vibrate) navigator.vibrate(50);
                }, 400); 
            };

            const handleTouchEnd = (e, startIdx) => {
                clearTimeout(longPressTimer.current);
                longPressTimer.current = null;
                if (isDragging.current) {
                    isDragging.current = false;
                    const touch = e.changedTouches[0];
                    const elem = document.elementFromPoint(touch.clientX, touch.clientY);
                    const dropTarget = elem?.closest('[data-discover-idx]');
                    
                    if (dropTarget) {
                        const dropIdx = parseInt(dropTarget.getAttribute('data-discover-idx'), 10);
                        if (dropIdx !== startIdx && !isNaN(dropIdx)) {
                            onReorderDiscover(startIdx, dropIdx);
                        }
                    }
                    setDraggedIdx(null);
                }
            };

            return (
              <div className="h-full px-4 pb-4 overflow-y-auto flex flex-col relative" style={{ touchAction: draggedIdx !== null ? 'none' : 'auto' }}>
                <h2 className="text-[1.8rem] font-display font-extrabold text-stone-800 tracking-tight mb-2 mt-4 px-1 shrink-0">Discover</h2>
                <div className="flex-1 grid grid-cols-2 gap-3 pb-8 auto-rows-fr relative">
                  {latestUpdates.map((item, index) => {
                    const { name: catName, iconClass, bg } = getCategoryDetails(item.categoryId);
                    const isDragged = draggedIdx === index;
                    return (
                      <button
                        key={item.id}
                        data-discover-idx={index}
                        onTouchStart={(e) => handleTouchStart(e, index)}
                        onTouchEnd={(e) => handleTouchEnd(e, index)}
                        onTouchCancel={() => { clearTimeout(longPressTimer.current); isDragging.current = false; setDraggedIdx(null); }}
                        onClick={() => { if (!isDragging.current && item.type === 'food') onSelectFood(item.foodId); }}
                        className={`relative rounded-[1.25rem] overflow-hidden flex flex-col items-start justify-end p-4 text-left shadow-sm ${bg} min-h-[140px] transition-transform select-none ${isDragged ? 'opacity-40 scale-95' : 'active:scale-95'}`}
                      >
                        {item.type === 'food' && (
                           <div className="absolute top-3 right-3 bg-white/40 p-2.5 rounded-full backdrop-blur-sm shadow-sm">
                              <i className={`fa-solid ${iconClass} text-stone-700 w-4 h-4 flex items-center justify-center opacity-60`}></i>
                           </div>
                        )}
                        <span className="font-display font-bold text-[1.1rem] leading-tight z-10 text-stone-800">
                          {item.title}
                        </span>
                        {catName && (
                          <span className="font-sans text-[0.8rem] mt-0.5 font-medium z-10 text-stone-500">{catName}</span>
                        )}
                      </button>
                    );
                  })}
                </div>

                {draggedIdx !== null && isDragging.current && (
                    <div 
                        className={`fixed pointer-events-none z-[100] shadow-2xl rounded-[1.25rem] p-4 flex flex-col items-start justify-end opacity-90 scale-105 min-h-[140px] w-[calc(50vw-1.25rem)]`}
                        style={{ left: touchPos.x, top: touchPos.y, transform: 'translate(-50%, -50%)', backgroundColor: getCategoryDetails(latestUpdates[draggedIdx].categoryId).bgColorHex }}
                    >
                        <div className="absolute top-3 right-3 bg-white/40 p-2.5 rounded-full backdrop-blur-sm shadow-sm">
                            <i className={`fa-solid ${getCategoryDetails(latestUpdates[draggedIdx].categoryId).iconClass} text-stone-700 opacity-60 w-4 h-4 flex items-center justify-center`}></i>
                        </div>
                        <span className="font-display font-bold text-[1.1rem] leading-tight text-stone-800">
                            {latestUpdates[draggedIdx].title}
                        </span>
                    </div>
                )}
              </div>
            );
        };

        const SavedItemCard = ({ item, recipes, onSelect }) => {
          const food = recipes[item.foodId];
          const variation = food?.variations.find(v => v.id === item.variationId);
          if (!food || !variation) return null;

          let subtitle = "Base recipe";
          if (item.mode === 'specific') {
              subtitle = `${item.targetYield} ${variation.yieldUnit}`;
          } else if (item.mode === 'availability') {
              const ing = variation.ingredients.find(i => i.id === item.selectedIngId);
              if (ing) subtitle = `Using ${item.availableAmt}${ing.unit} of ${ing.name}`;
          }

          return (
              <button onClick={() => onSelect(item)} className="bg-white border-2 border-stone-100 rounded-[1.25rem] p-5 text-left shadow-sm hover:border-stone-300 transition-colors flex items-center justify-between group active:scale-[0.98] w-full">
                  <div>
                      <h3 className="font-display text-lg font-bold text-stone-800">{food.name} <span className="text-[0.85rem] font-sans font-normal text-stone-500">({variation.name})</span></h3>
                      <p className="font-sans text-stone-500 font-medium text-sm mt-1">{subtitle}</p>
                  </div>
                  <i className="fa-solid fa-chevron-right text-stone-300 group-hover:text-stone-500"></i>
              </button>
          );
        };

        const SavedListView = ({ type, items, recipes, onSelectSaved, onRemove }) => (
          <div className={`h-full px-4 pb-4 pt-4 overflow-y-auto ${type === 'fav' ? 'bg-rose-50/30' : 'bg-stone-100/50'}`}>
            {items.length === 0 ? (
              <div className="flex flex-col items-center justify-center h-64 text-stone-400 font-sans text-center px-8">
                <i className={`fa-solid ${type === 'fav' ? 'fa-heart text-rose-200' : 'fa-list-check text-stone-200'} text-5xl mb-4`}></i>
                <p>No items saved yet.</p>
              </div>
            ) : (
              <div className="flex flex-col gap-3">
                {items.map(item => (
                    <SwipeableItem key={item.id} onDelete={() => onRemove(item.id)}>
                        <SavedItemCard item={item} recipes={recipes} onSelect={onSelectSaved} />
                    </SwipeableItem>
                ))}
              </div>
            )}
          </div>
        );

        const SettingsView = ({ appData, favourites, queue, onImport, setAlertMsg }) => {
            const handleExport = () => {
                const data = { appData, favourites, queue };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'food-maker-backup.json'; a.click(); URL.revokeObjectURL(url);
            };

            const handleImport = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (imported.appData && imported.favourites && imported.queue) {
                            onImport(imported); setAlertMsg("Data imported successfully!");
                        } else { setAlertMsg("Invalid backup file."); }
                    } catch (error) { setAlertMsg("Error reading file."); }
                };
                reader.readAsText(file);
            };

            return (
                <div className="h-full px-4 pb-4 pt-4 overflow-y-auto bg-stone-50/50">
                    <div className="space-y-4">
                        <div className="bg-white p-5 rounded-[1.25rem] shadow-sm border border-stone-200">
                            <h3 className="font-display font-bold text-lg mb-2 text-stone-800">Backup Your Data</h3>
                            <p className="font-sans text-stone-500 text-sm mb-4">Export your custom recipes, favourites, and queue to a file.</p>
                            <button onClick={handleExport} className="w-full bg-stone-100 text-stone-800 font-sans font-bold py-3 rounded-xl active:scale-95 transition-transform flex justify-center items-center gap-2">
                                <i className="fa-solid fa-download"></i> Export Data
                            </button>
                        </div>
                        <div className="bg-white p-5 rounded-[1.25rem] shadow-sm border border-stone-200">
                            <h3 className="font-display font-bold text-lg mb-2 text-stone-800">Restore Data</h3>
                            <p className="font-sans text-stone-500 text-sm mb-4">Import a previously exported backup file.</p>
                            <label className="w-full bg-stone-100 text-stone-800 font-sans font-bold py-3 rounded-xl active:scale-95 transition-transform flex justify-center items-center gap-2 cursor-pointer">
                                <i className="fa-solid fa-upload"></i> Import Data
                                <input type="file" accept=".json" className="hidden" onChange={handleImport} />
                            </label>
                        </div>
                    </div>
                </div>
            );
        };

        const AboutView = () => (
            <div className="h-full px-4 pb-4 pt-4 overflow-y-auto bg-stone-50/50">
                <div className="bg-white p-8 rounded-[1.25rem] shadow-sm border border-stone-200 text-center flex flex-col items-center">
                    <div className="w-20 h-20 bg-stone-100 rounded-full flex items-center justify-center mb-4 shadow-inner">
                        <i className="fa-solid fa-utensils text-3xl text-stone-400"></i>
                    </div>
                    <h3 className="font-display font-extrabold text-2xl text-stone-800 mb-2">Food Maker</h3>
                    <p className="font-sans text-stone-500 mb-8 text-[0.95rem] leading-relaxed">
                        This is a creation by <strong className="text-stone-700">Tarik Otoch</strong> for personal use.
                    </p>
                    <a href="https://www.linkedin.com/in/tarikotoch" target="_blank" rel="noopener noreferrer" className="w-full bg-[#0A66C2] text-white font-sans font-bold py-3.5 rounded-xl active:scale-95 transition-transform flex items-center justify-center gap-2 shadow-sm mb-3">
                        <i className="fa-brands fa-linkedin text-xl"></i> Connect on LinkedIn
                    </a>
                    <a href="https://theocs2016.github.io/cup-maker/" target="_blank" rel="noopener noreferrer" className="w-full bg-stone-800 text-white font-sans font-bold py-3.5 rounded-xl active:scale-95 transition-transform flex items-center justify-center gap-2 shadow-sm">
                        <i className="fa-solid fa-trophy text-xl"></i> Go to Cup Maker
                    </a>
                </div>
            </div>
        );

        const TrashView = ({ trash, onRestore, onDeletePerm, onConfirm }) => (
            <div className="h-full px-4 pb-4 pt-4 overflow-y-auto bg-stone-100/50">
                {trash.length === 0 ? (
                    <div className="flex flex-col items-center justify-center h-64 text-stone-400 font-sans text-center px-8">
                        <i className="fa-solid fa-trash text-5xl mb-4 text-stone-200"></i>
                        <p className="font-sans">No deleted recipes.</p>
                    </div>
                ) : (
                    <div className="grid grid-cols-1 gap-3">

        const VariationsView = ({ food, onSelectVariation, onTogglePin, isPinned, favourites, queue, onConfirm, onQuickSave }) => {

                  type="button"
                  className={`absolute top-4 right-4 z-20 border p-2 rounded-full shadow-sm active:scale-95 transition-colors ${isPinned ? 'bg-amber-100 border-amber-300 text-amber-700' : 'bg-white border-stone-200 text-stone-400 hover:text-stone-600'}`}>
                  <i className="fa-solid fa-thumbtack w-5 h-5 flex items-center justify-center"></i>
              </button>

              <p className="font-sans text-stone-500 font-medium mb-6 pr-10">Which {food.name} recipe do you want to make today? <br/><span className="text-xs text-stone-400 font-sans">(Tip: Tap the pin to add to Discover. Long press to quick save)</span></p>
              
              <div className="space-y-4">

                  return (
                    <button

                        onTouchEnd={handleTouchEnd}

                        className="w-full text-left bg-white rounded-[1.25rem] shadow-sm border border-stone-200 hover:border-stone-400 hover:shadow-md transition-all active:scale-[0.98] flex flex-col p-6 touch-action-manipulation select-none relative overflow-hidden"
                    >

                            {isFav && <i className="fa-solid fa-heart text-rose-500 text-sm"></i>}
                            {isQueued && <i className="fa-solid fa-list-check text-stone-700 text-sm"></i>}

        const CalcModeView = ({ onSelectMode }) => (
          <div className="h-full p-4 overflow-y-auto pb-20">

            <div className="space-y-4">
              <button
                onClick={() => onSelectMode('specific')}
                className="w-full text-left bg-white p-6 rounded-[1.25rem] shadow-sm border border-stone-200 hover:border-stone-400 transition-all active:scale-[0.98] group flex flex-col gap-4"
              >

                  <i className="fa-solid fa-calculator text-2xl text-[#9A623A]"></i>

                  <h3 className="text-xl font-display font-extrabold text-[#332211] mb-1">Specific amount</h3>
                  <p className="font-sans text-stone-500 text-[0.95rem] leading-relaxed">Tell us how many portions you want to make and we'll calculate the whole recipe.</p>
                </div>
              </button>

              <button
                onClick={() => onSelectMode('availability')}
                className="w-full text-left bg-gradient-to-br from-[#FDE397] to-[#E5AC44] p-6 rounded-[1.25rem] shadow-sm border border-amber-200 hover:shadow-md transition-all active:scale-[0.98] group flex flex-col gap-4"
              >
                <div className="bg-[#FEF1CD] w-12 h-12 rounded-2xl flex items-center justify-center group-hover:scale-110 transition-transform shadow-sm">
                  <i className="fa-solid fa-leaf text-2xl text-[#824E26]"></i>
                </div>
                <div>
                  <h3 className="text-xl font-display font-extrabold text-[#412510] mb-1">Use what I have</h3>
                  <p className="font-sans text-[#6C441D] text-[0.95rem] leading-relaxed font-medium">Enter available ingredients and find out how many portions it yields.</p>
                </div>
              </button>
            </div>
          </div>
        );

        const RecipeView = ({ variation, mode, calcParams, setCalcParams, onUpdateVariation, onEditRecipe, onDeleteRecipe, onConfirm }) => {
          const [draggedId, setDraggedId] = useState(null);
          const [dragOverId, setDragOverId] = useState(null);
          const [checkedIngs, setCheckedIngs] = useState({});
          const [hideCompleted, setHideCompleted] = useState(false);

          useEffect(() => setCheckedIngs({}), [variation?.id]);

          useEffect(() => {
            if (mode === 'specific' && calcParams.targetYield === null) {
              setCalcParams(prev => ({ ...prev, targetYield: variation.baseYield }));
            } else if (mode === 'availability' && calcParams.selectedIngId === null) {
              setCalcParams(prev => ({ ...prev, selectedIngId: variation.ingredients[0].id, availableAmt: variation.ingredients[0].baseAmount }));
            }
          }, [mode, variation, calcParams.targetYield, calcParams.selectedIngId, setCalcParams]);

          const displayTargetYield = calcParams.targetYield !== null ? calcParams.targetYield : variation.baseYield;
          const displaySelectedIngId = calcParams.selectedIngId !== null ? calcParams.selectedIngId : variation.ingredients[0].id;
          const displayAvailableAmt = calcParams.availableAmt !== null ? calcParams.availableAmt : variation.ingredients[0].baseAmount;

          let multiplier = 1;
          let estimatedYield = variation.baseYield;

          if (mode === 'specific') {
            const parsedYield = parseFloat(displayTargetYield) || 0;
            multiplier = parsedYield / variation.baseYield;
            estimatedYield = parsedYield;
          } else {
            const baseIng = variation.ingredients.find(i => i.id === displaySelectedIngId);
            const parsedAmt = parseFloat(displayAvailableAmt) || 0;
            if(baseIng) multiplier = parsedAmt / baseIng.baseAmount;
            estimatedYield = variation.baseYield * multiplier;
          }

          const formatAmount = (ing) => {
            const calcMetric = ing.baseAmount * multiplier;
            const calcVol = ing.volAmount ? ing.volAmount * multiplier : null;
            let metricStr = isNaN(calcMetric) || calcMetric === 0 ? "0" : 
                (ing.unit === 'units' || ing.unit === 'cm' || ing.unit === 'slices' || ing.unit === 'pieces' || ing.unit === 'handful' ? calcMetric.toFixed(1).replace('.0', '') : Math.round(calcMetric).toString());
            let volStr = calcVol ? parseFloat(calcVol.toFixed(2)).toString() : null;
            return { metricVal: metricStr, metricUnit: ing.unit, volVal: volStr, volUnit: ing.volUnit };
          };

          const handleDragStart = (e, id) => { e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; setDraggedId(id); };
          const handleDragOver = (e, id) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; if (id !== dragOverId) setDragOverId(id); };
          const handleDragEnd = () => { setDraggedId(null); setDragOverId(null); };

          const handleDrop = (e, targetId) => {
             e.preventDefault();
             const sourceId = e.dataTransfer.getData('text/plain');
             if (sourceId && sourceId !== targetId) {
                 const sourceIdx = variation.ingredients.findIndex(i => i.id === sourceId);
                 const targetIdx = variation.ingredients.findIndex(i => i.id === targetId);
                 if (sourceIdx > -1 && targetIdx > -1) {
                     const targetGroup = variation.ingredients[targetIdx].group || '';
                     const newIngs = [...variation.ingredients];
                     const [moved] = newIngs.splice(sourceIdx, 1);
                     moved.group = targetGroup;
                     newIngs.splice(targetIdx, 0, moved);
                     onUpdateVariation({ ...variation, ingredients: newIngs });
                 }
             }
             setDraggedId(null); setDragOverId(null);
          };

          const toggleIngredient = (id) => setCheckedIngs(prev => ({ ...prev, [id]: !prev[id] }));

          const ingredientGroups = {};
          const checkedList = [];
          variation.ingredients.forEach(ing => {
            if (checkedIngs[ing.id]) checkedList.push(ing);
            else {
                const groupName = (ing.group || '').trim() || 'Ingredients';
                if (!ingredientGroups[groupName]) ingredientGroups[groupName] = [];
                ingredientGroups[groupName].push(ing);
            }
          });

          const renderIngredientRow = (ing, isChecked) => {
            const formatted = formatAmount(ing);
            return (
              <li 
                key={ing.id} draggable="true" onDragStart={(e) => handleDragStart(e, ing.id)} onDragOver={(e) => handleDragOver(e, ing.id)} onDrop={(e) => handleDrop(e, ing.id)} onDragEnd={handleDragEnd}
                className={`flex items-stretch hover:bg-stone-50 transition-colors font-sans 
                  ${draggedId === ing.id ? 'opacity-40 bg-stone-100' : ''} 
                  ${dragOverId === ing.id && draggedId !== ing.id ? 'border-t-2 border-amber-400 bg-amber-50' : ''}
                  ${isChecked ? 'bg-stone-50/60' : ''}`}
              >
                <div className="pl-4 py-4 flex items-center justify-center touch-none cursor-move">
                    <i className="fa-solid fa-grip-vertical text-stone-300 hover:text-stone-400 active:text-stone-500 px-2 py-1"></i>
                </div>
                <div className="flex-1 p-4 pl-2 flex items-center justify-between cursor-pointer touch-action-manipulation" onClick={() => toggleIngredient(ing.id)}>
                   <div className="flex items-center gap-3">
                       {isChecked ? <i className="fa-solid fa-circle-check text-stone-400 text-[1.2rem]"></i> : <i className="fa-regular fa-circle text-stone-300 text-[1.2rem]"></i>}
                       <span className={`font-sans font-medium text-[0.95rem] leading-relaxed pr-2 transition-all ${isChecked ? 'text-stone-400 line-through' : 'text-stone-700'}`}>{ing.name}</span>
                   </div>
                   <div className="text-right shrink-0 ml-4 flex flex-col items-end font-sans transition-all">
                       <div className={`font-sans font-bold text-[0.95rem] ${isChecked ? 'text-stone-400' : 'text-stone-800'}`}>
                         {formatted.metricVal} <span className={`font-medium ${isChecked ? 'text-stone-400' : 'text-stone-600'}`}>{formatted.metricUnit}</span>
                       </div>
                       {formatted.volVal && <div className={`font-sans text-xs font-medium mt-0.5 ${isChecked ? 'text-stone-300' : 'text-stone-400'}`}>{formatted.volVal} {formatted.volUnit}</div>}
                   </div>
                </div>
              </li>
            );
          };

          return (
            <div className="h-full p-4 overflow-y-auto pb-24 scroll-smooth">
              {mode === 'specific' ? (
                <div className="bg-white p-6 rounded-[1.25rem] shadow-sm border border-stone-200 mb-8 pl-10">
                  <label className="block text-[0.7rem] font-sans font-bold text-stone-500 mb-2 uppercase tracking-wide">
                    How many {variation.yieldUnit} do you want?
                  </label>
                  <div className="flex items-end gap-3 pl-4">
                    <input type="number" min="0" value={displayTargetYield} onChange={e => setCalcParams(prev => ({ ...prev, targetYield: e.target.value }))} className="w-full text-4xl font-display font-extrabold text-stone-800 bg-transparent border-b-2 border-stone-200 focus:border-stone-400 outline-none pb-2 transition-colors pl-2" />
                    <span className="text-base font-sans font-bold text-stone-400 pb-2">{variation.yieldUnit}</span>
                  </div>
                </div>
              ) : (
                <div className="bg-white p-6 rounded-[1.25rem] shadow-sm border border-stone-200 mb-8 flex flex-col gap-6 relative overflow-hidden pl-10">
                  <div className="absolute top-0 left-0 w-1.5 h-full bg-stone-800"></div>
                  <div>
                    <label className="block text-[0.7rem] font-sans font-bold text-stone-500 mb-2 uppercase tracking-wide">Base ingredient</label>
                    <div className="pl-4">
                        <select value={displaySelectedIngId} onChange={e => { const newBaseIng = variation.ingredients.find(i => i.id === e.target.value); setCalcParams(prev => ({ ...prev, selectedIngId: e.target.value, availableAmt: newBaseIng.baseAmount })); }} className="w-full text-base font-sans font-bold text-stone-800 bg-transparent border-b-2 border-stone-200 focus:border-stone-400 outline-none pb-2 cursor-pointer pl-1">
                          {variation.ingredients.map(ing => <option key={ing.id} value={ing.id}>{ing.name}</option>)}
                        </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-[0.7rem] font-sans font-bold text-stone-500 mb-2 uppercase tracking-wide">Available amount</label>
                    <div className="flex items-end gap-3 pl-4">
                      <input type="number" min="0" value={displayAvailableAmt} onChange={e => setCalcParams(prev => ({ ...prev, availableAmt: e.target.value }))} className="w-full text-4xl font-display font-extrabold text-stone-800 bg-transparent border-b-2 border-stone-200 focus:border-stone-400 outline-none pb-2 transition-colors pl-2" />
                      <span className="text-base font-sans font-bold text-stone-400 pb-2">{variation.ingredients.find(i => i.id === displaySelectedIngId)?.unit || ''}</span>
                    </div>
                  </div>
                  <div className="bg-stone-50 border border-stone-100 text-stone-800 p-4 rounded-xl flex items-center justify-between mt-2 shadow-sm ml-[-0.5rem]">
                    <span className="font-sans font-semibold text-sm">Estimated yield:</span>
                    <span className="font-display font-extrabold text-lg">{Math.round(estimatedYield || 0)} {variation.yieldUnit}</span>
                  </div>
                </div>
              )}
              
              <div className="flex justify-between items-center mb-4">
                  <h3 className="text-xl font-display font-extrabold text-stone-800 tracking-tight">Ingredients</h3>
                  {checkedList.length > 0 && (
                      <button 
                          onClick={() => setHideCompleted(!hideCompleted)} 
                          className="text-[0.8rem] font-sans font-bold text-stone-500 hover:text-stone-700 bg-stone-100 hover:bg-stone-200 px-3 py-1.5 rounded-full transition-colors flex items-center gap-1.5 active:scale-95"
                      >
                          <i className={`fa-solid ${hideCompleted ? 'fa-eye' : 'fa-eye-slash'}`}></i>
                          {hideCompleted ? 'Show checked' : 'Hide checked'}
                      </button>
                  )}
              </div>

              <div className="bg-white rounded-[1.25rem] shadow-sm border border-stone-200 overflow-hidden mb-8">
                {Object.entries(ingredientGroups).map(([groupName, ings], gIdx) => (
                  <React.Fragment key={gIdx}>
                    {(Object.keys(ingredientGroups).length > 1 || groupName !== 'Ingredients') && (
                      <div className="bg-stone-50 px-4 py-2.5 border-y border-stone-200 first:border-t-0 flex items-center">
                        <span className="font-sans font-bold text-stone-500 text-xs uppercase tracking-wider">{groupName}</span>
                      </div>
                    )}
                    <ul className="divide-y divide-stone-100 font-sans">
                      {ings?.map(ing => renderIngredientRow(ing, false))}
                    </ul>
                  </React.Fragment>
                ))}

                {(!hideCompleted && checkedList.length > 0) && (
                  <React.Fragment>
                     <div className="bg-stone-100 px-4 py-2.5 border-y border-stone-200 flex items-center">
                       <span className="font-sans font-bold text-stone-400 text-xs uppercase tracking-wider">Checked</span>
                     </div>
                     <ul className="divide-y divide-stone-100 font-sans">
                       {checkedList.map(ing => renderIngredientRow(ing, true))}
                     </ul>
                  </React.Fragment>
                )}
              </div>

              <h3 className="text-xl font-display font-extrabold text-stone-800 tracking-tight mb-5">Instructions</h3>
              <div className="space-y-5">
                {variation?.steps?.map((step, index) => (
                  <div key={index} className="flex gap-3 items-start">
                    <div className="w-7 h-7 rounded-full bg-stone-800 text-white flex items-center justify-center font-sans font-bold shrink-0 mt-0.5 shadow-sm text-sm">
                      {index + 1}
                    </div>
                    <p className="font-sans text-stone-700 font-normal leading-relaxed pt-0.5 text-[0.95rem]">{step}</p>
                  </div>
                ))}
              </div>

              {variation?.notes && variation.notes.length > 0 && (
                <div className="mt-8 pt-8 border-t border-stone-200">
                  <h3 className="text-xl font-display font-extrabold text-stone-800 tracking-tight mb-4">Notes</h3>
                  <ul className="list-disc pl-5 space-y-2 text-stone-600 font-sans text-[0.95rem] leading-relaxed">
                    {variation.notes.map((note, i) => <li key={i} dangerouslySetInnerHTML={{ __html: note }} />)}
                  </ul>
                </div>
              )}

              {variation?.source && (
                <div className="mt-8 text-sm text-stone-500 font-sans bg-stone-100 p-4 rounded-xl flex flex-col gap-1">
                  <span className="font-bold font-sans text-stone-700">Source: </span>
                  {variation.source.startsWith('http') ? (
                    <a href={variation.source} target="_blank" className="text-stone-600 hover:text-stone-800 underline break-all font-sans">{variation.source}</a>
                  ) : (
                    <span className="font-sans">{variation.source}</span>
                  )}
                </div>
              )}

              <div className="mt-8 pt-8 border-t border-stone-200 flex gap-3">
                  <button onClick={() => onEditRecipe(variation)} className="flex-1 py-3.5 bg-stone-100 text-stone-700 font-sans font-bold rounded-xl active:scale-95 transition-transform flex items-center justify-center gap-2 shadow-sm">
                      <i className="fa-solid fa-pen-to-square"></i> Edit
                  </button>
                  <button onClick={() => {
                      onConfirm("Are you sure you want to delete this recipe variation?", () => onDeleteRecipe(variation.id), "Delete");
                  }} className="flex-1 py-3.5 bg-rose-50 text-rose-600 font-sans font-bold rounded-xl active:scale-95 transition-transform flex items-center justify-center gap-2 shadow-sm">
                      <i className="fa-solid fa-trash"></i> Delete
                  </button>
              </div>
            </div>
          );
        };

        const App = () => {
          const [appData, setAppData] = useState(() => {
            try {
                const saved = localStorage.getItem('foodMakerAppData');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    const trashIds = (parsed.trash || []).map(t => t.id);

                    let mergedMenu = defaultMenu.map(initialCat => {
                       const savedCat = parsed.menu?.find(c => c.id === initialCat.id);
                       let subcats = initialCat.subcategories.map(initialSub => {
                           const savedSub = savedCat?.subcategories?.find(s => s.id === initialSub.id);
                           const mergedFoods = [...initialSub.foods];
                           if (savedSub) {
                               savedSub.foods.forEach(f => {
                                   if (!mergedFoods.find(mf => mf.id === f.id)) mergedFoods.push(f);
                               });
                           }
                           return { ...initialSub, foods: mergedFoods.filter(f => !trashIds.includes(f.id)) };
                       });

                       if (savedCat) {
                           savedCat.subcategories?.forEach(sSub => {
                               if (!subcats.find(s => s.id === sSub.id)) {
                                   subcats.push({ ...sSub, foods: sSub.foods.filter(f => !trashIds.includes(f.id)) });
                               }
                           });
                       }
                       return { ...initialCat, subcategories: subcats.filter(sub => sub.foods && sub.foods.length > 0) };
                    });

                    const dessertsCat = mergedMenu.find(c => c.id === 'desserts');
                    if (dessertsCat) {
                        let myRecipes = dessertsCat.subcategories.find(s => s.id === 'my-recipes');
                        if (myRecipes && myRecipes.foods.some(f => f.id === 'gabriels-bolo-crucial')) {
                            myRecipes.foods = myRecipes.foods.filter(f => f.id !== 'gabriels-bolo-crucial');
                            let kids = dessertsCat.subcategories.find(s => s.id === 'kids-creations');
                            if (!kids) {
                                kids = { id: 'kids-creations', name: "Kids' Creations", foods: [] };
                                dessertsCat.subcategories.push(kids);
                            }
                            if (!kids.foods.some(f => f.id === 'gabriels-bolo-crucial')) {
                                kids.foods.push({ id: 'gabriels-bolo-crucial', name: "Gabriel's Bolo Crucial" });
                            }
                        }
                        dessertsCat.subcategories = dessertsCat.subcategories.filter(s => s.foods.length > 0);
                    }

                    const mergedRecipes = {};
                    Object.keys(defaultRecipes).forEach(key => {
                        if (!trashIds.includes(key)) {
                            mergedRecipes[key] = { ...defaultRecipes[key] };
                            if (parsed.recipes && parsed.recipes[key] && !parsed.recipes[key].isCustom) {
                                mergedRecipes[key].variations = parsed.recipes[key].variations;
                            }
                        }
                    });

                    if (parsed.recipes) {
                        Object.keys(parsed.recipes).forEach(key => {
                            if (parsed.recipes[key].isCustom && !trashIds.includes(key)) { mergedRecipes[key] = parsed.recipes[key]; }
                        });
                    }

                    let initUpdates = parsed.latestUpdates || defaultDiscover;
                    if (parsed.appVersion !== '3.4') {
                        initUpdates = defaultDiscover; 
                    }

                    return { recipes: mergedRecipes, menu: mergedMenu, latestUpdates: initUpdates, trash: parsed.trash || [], appVersion: '3.4' };
                }
            } catch (error) { console.error("Failed to parse Local Storage", error); }
            
            const initialCleanMenu = defaultMenu.map(cat => ({
                ...cat, subcategories: cat.subcategories.filter(sub => sub.foods && sub.foods.length > 0)
            }));
            return { menu: initialCleanMenu, recipes: defaultRecipes, latestUpdates: defaultDiscover, trash: [], appVersion: '3.4' };
          });
          
          const [favourites, setFavourites] = useState(() => { try { return JSON.parse(localStorage.getItem('foodMakerFavs')) || []; } catch(e) { return []; } }); 
          const [queue, setQueue] = useState(() => { try { return JSON.parse(localStorage.getItem('foodMakerQueue')) || []; } catch(e) { return []; } }); 

          useEffect(() => localStorage.setItem('foodMakerAppData', JSON.stringify(appData)), [appData]);
          useEffect(() => localStorage.setItem('foodMakerFavs', JSON.stringify(favourites)), [favourites]);
          useEffect(() => localStorage.setItem('foodMakerQueue', JSON.stringify(queue)), [queue]);

          const [view, setView] = useState('home'); 
          const [foodId, setFoodId] = useState(null);
          const [variationId, setVariationId] = useState(null);
          const [calcMode, setCalcMode] = useState(null);
          const [isMenuOpen, setIsMenuOpen] = useState(false);
          const [alertMsg, setAlertMsg] = useState(null);
          const [editData, setEditData] = useState(null);
          const [calcParams, setCalcParams] = useState({ targetYield: null, selectedIngId: null, availableAmt: null });
          const [replaceQueueModal, setReplaceQueueModal] = useState(null);
          const [replaceDiscoverModal, setReplaceDiscoverModal] = useState(null);
          const [confirmDialog, setConfirmDialog] = useState(null);
          const [importPrompt, setImportPrompt] = useState(null);
          const [quickSaveModal, setQuickSaveModal] = useState(null); 

          useEffect(() => {
              const params = new URLSearchParams(window.location.search);
              const importStr = params.get('share');
              if (importStr) {
                  try {
                      let decodedStr;
                      if (window.LZString) {
                          decodedStr = window.LZString.decompressFromEncodedURIComponent(importStr);
                      }
                      
                      if (!decodedStr) {
                          try {
                              decodedStr = decodeURIComponent(atob(importStr));
                          } catch (e) {
                              try {
                                  decodedStr = decodeURIComponent(escape(atob(decodeURIComponent(importStr))));
                              } catch(e2) {}
                          }
                      }
                      
                      if (!decodedStr) throw new Error("Could not decode share link");
                      
                      let decodedData = JSON.parse(decodedStr);
                      
                      if (decodedData.f && decodedData.v) {
                          decodedData = {
                              food: {
                                  id: decodedData.f.i, name: decodedData.f.n, isCustom: true, categoryId: decodedData.f.c,
                                  variations: [{
                                      id: decodedData.v.i, name: decodedData.v.n, description: decodedData.v.d,
                                      baseYield: decodedData.v.y, yieldUnit: decodedData.v.u,
                                      ingredients: decodedData.v.ig.map((ig, idx) => ({
                                          id: `ing-${idx}`, name: ig[0], baseAmount: ig[1], unit: ig[2], volAmount: ig[3], volUnit: ig[4], group: ig[5]
                                      })),
                                      steps: decodedData.v.s, notes: decodedData.v.nt, source: decodedData.v.src
                                  }]
                              }
                          };
                      }

                      if (decodedData && decodedData.food) {
                          setImportPrompt(decodedData.food);
                      }
                      window.history.replaceState({}, document.title, window.location.pathname);
                  } catch (e) {
                      console.error("Import failed:", e);
                      setAlertMsg("Failed to import the shared recipe. The link might be invalid or corrupted.");
                      window.history.replaceState({}, document.title, window.location.pathname);
                  }
              }
          }, []);

          const handleSelectFood = (id) => { setFoodId(id); setView('variations'); };
          const handleSelectVariation = (id) => { setVariationId(id); setCalcParams({ targetYield: null, selectedIngId: null, availableAmt: null }); setView('calcMode'); };
          const handleSelectMode = (mode) => { setCalcMode(mode); setView('recipe'); };
          const handleSelectSaved = (savedItem) => {
            setFoodId(savedItem.foodId); setVariationId(savedItem.variationId);
            if (savedItem.mode) { setCalcMode(savedItem.mode); setCalcParams({ targetYield: savedItem.targetYield, selectedIngId: savedItem.selectedIngId, availableAmt: savedItem.availableAmt }); setView('recipe'); } 
            else { setCalcParams({ targetYield: null, selectedIngId: null, availableAmt: null }); setView('calcMode'); }
          };

          const goBack = () => {
            if (view === 'recipe') setView('calcMode');
            else if (view === 'calcMode') setView('variations');
            else if (view === 'variations') { setView('home'); setFoodId(null); }
            else if (['favourites', 'queue', 'settings', 'trash', 'create', 'about'].includes(view)) setView('home');
          };

          const isSavedVar = (list, fId, vId) => list.some(item => item.foodId === fId && item.variationId === vId);

          const toggleFavourite = () => {
            if (!foodId || !variationId || view !== 'recipe') return;
            if (isSavedVar(favourites, foodId, variationId)) {
                setFavourites(prev => prev.filter(item => !(item.foodId === foodId && item.variationId === variationId)));
            } else {
                setFavourites(prev => [...prev, { id: Date.now().toString(), foodId, variationId, mode: calcMode, ...calcParams }]);
            }
          };

          const addToQueueWithLimit = (newItem) => {
              if (queue.length >= 3) { setReplaceQueueModal(newItem); } else { setQueue(prev => [...prev, newItem]); setAlertMsg("Added to Up Next!"); }
          };

          const confirmQueueReplace = (oldItemId) => {
              setQueue(prev => { const newQ = prev.filter(q => q.id !== oldItemId); return [...newQ, replaceQueueModal]; });
              setReplaceQueueModal(null); setAlertMsg("Up Next updated!");
          };

          const toggleQueue = () => {
            if (!foodId || !variationId || view !== 'recipe') return;
            if (isSavedVar(queue, foodId, variationId)) {
                setQueue(prev => prev.filter(item => !(item.foodId === foodId && item.variationId === variationId)));
            } else {
                addToQueueWithLimit({ id: Date.now().toString(), foodId, variationId, mode: calcMode, ...calcParams });
            }
          };

          const handleQuickSaveTrigger = (fId, vId) => {
              setQuickSaveModal({ foodId: fId, varId: vId });
          };

          const handleConfirmQuickSave = (listType) => {
              const { foodId, varId } = quickSaveModal;
              if (listType === 'fav') {
                  if (isSavedVar(favourites, foodId, varId)) {
                      setAlertMsg("Already in your Favourites!");
                  } else {
                      setFavourites(prev => [...prev, { id: Date.now().toString(), foodId, variationId: varId, mode: null, targetYield: null, selectedIngId: null, availableAmt: null }]);
                      setAlertMsg("Added to Favourites!");
                  }
              } else {
                  if (isSavedVar(queue, foodId, varId)) {
                      setAlertMsg("Already in Up Next!");
                  } else {
                      addToQueueWithLimit({ id: Date.now().toString(), foodId, variationId: varId, mode: null, targetYield: null, selectedIngId: null, availableAmt: null });
                  }
              }
              setQuickSaveModal(null);
          };

          const handlePinToDiscover = (replaceUpdateId) => {
              const fId = replaceDiscoverModal;
              setAppData(prev => {
                  const food = prev.recipes[fId];
                  const newUpdates = prev.latestUpdates.map(u => {
                      if (u.id === replaceUpdateId) {
                          return { id: Date.now().toString(), type: 'food', foodId: fId, title: food.name, categoryId: food.categoryId || 'snacks' };
                      }
                      return u;
                  });
                  return { ...prev, latestUpdates: newUpdates };
              });
              setAlertMsg("Added to Discover Home Screen!");
              setReplaceDiscoverModal(null);
          };

          const handleUnpinFromDiscover = (unpinFoodId) => {
              setAppData(prev => {
                  let newUpdates = prev.latestUpdates.filter(u => u.foodId !== unpinFoodId);
                  const currentIds = newUpdates.map(u => u.foodId);
                  const availableFoods = Object.values(prev.recipes).filter(f => !currentIds.includes(f.id));
                  
                  if (newUpdates.length < 8 && availableFoods.length > 0) {
                      const fallback = availableFoods[availableFoods.length - 1];
                      newUpdates.push({ id: Date.now().toString(), type: 'food', foodId: fallback.id, title: fallback.name, categoryId: fallback.categoryId || 'snacks' });
                  }
                  return { ...prev, latestUpdates: newUpdates };
              });
              setAlertMsg("Removed from Discover Home Screen.");
          };

          const handleReorderDiscover = (sourceIdx, targetIdx) => {
              setAppData(prev => {
                  const newUpdates = [...prev.latestUpdates];
                  const [moved] = newUpdates.splice(sourceIdx, 1);
                  newUpdates.splice(targetIdx, 0, moved);
                  return { ...prev, latestUpdates: newUpdates };
              });
          };

          const handleShare = async () => {
             const food = appData.recipes[foodId]; 
             const variation = food.variations.find(v => v.id === variationId);
             const title = `${food.name} - ${variation.name}`;
             
             const minifiedData = {
                 f: { i: food.id, n: food.name, c: food.categoryId },
                 v: {
                     i: variation.id, n: variation.name, d: variation.description, y: variation.baseYield, u: variation.yieldUnit,
                     ig: variation.ingredients.map(ig => [ig.name, ig.baseAmount, ig.unit, ig.volAmount, ig.volUnit, ig.group]),
                     s: variation.steps, nt: variation.notes, src: variation.source
                 }
             };

             let encoded;
             if (window.LZString) {
                 encoded = window.LZString.compressToEncodedURIComponent(JSON.stringify(minifiedData));
             } else {
                 encoded = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(minifiedData)))));
             }
             
             const shareUrl = `${window.location.origin}${window.location.pathname}?share=${encoded}`;

             if(navigator.share) {
                 try {
                     await navigator.share({ 
                         title: `Food Maker: ${title}`, 
                         text: `I want to share this recipe for ${title} with you! Tap the link to instantly add it to your Food Maker app:\n\n`,
                         url: shareUrl
                     });
                 } catch(err) { console.log('Error sharing via native API', err); }
             } else {
                 try {
                     await navigator.clipboard.writeText(`I want to share this recipe for ${title} with you! Tap the link to instantly add it to your Food Maker app: ${shareUrl}`);
                     setAlertMsg("Share link copied to clipboard!");
                 } catch(err) {
                     const textArea = document.createElement("textarea");
                     textArea.value = shareUrl;
                     document.body.appendChild(textArea);
                     textArea.select();
                     document.execCommand("copy");
                     document.body.removeChild(textArea);
                     setAlertMsg("Share link copied to clipboard!");
                 }
             }
          };

          const confirmAction = (message, action, confirmText) => {
              setConfirmDialog({ message, action, confirmText });
          };

          const handleCreateRecipe = ({ newRecipe, categoryId, subcategoryDetails, isEdit, oldSubcatId }) => {
            setAppData(prev => {
              let finalMenu = JSON.parse(JSON.stringify(prev.menu));
              const existingFood = prev.recipes[newRecipe.id];
              let newUpdates = [...(prev.latestUpdates || [])];

              if (isEdit && existingFood) {
                  finalMenu = finalMenu.map(cat => ({
                      ...cat,
                      subcategories: (cat.subcategories || []).map(sub => ({
                          ...sub, foods: sub.foods.filter(f => f.id !== newRecipe.id)
                      }))
                  }));
              }

              finalMenu = finalMenu.map(cat => {
                  if (cat.id === categoryId) {
                      let subcats = [...(cat.subcategories || [])];
                      let sub = subcats.find(s => s.id === subcategoryDetails.id);
                      if (!sub) {
                          sub = { id: subcategoryDetails.id, name: subcategoryDetails.name, foods: [] };
                          subcats.push(sub);
                      }
                      if (!sub.foods.some(f => f.id === newRecipe.id)) {
                          sub.foods.push({ id: newRecipe.id, name: newRecipe.name });
                      }
                      return { ...cat, subcategories: subcats };
                  }
                  return cat;
              });

              if (isEdit && existingFood && existingFood.name !== newRecipe.name) {
                  newUpdates = newUpdates.map(u => u.foodId === newRecipe.id ? { ...u, title: newRecipe.name } : u);
              }

              finalMenu = finalMenu.map(cat => ({
                  ...cat, subcategories: (cat.subcategories || []).filter(sub => sub.foods && sub.foods.length > 0)
              }));

              let updatedVariations = newRecipe.variations;
              if (existingFood && isEdit) {
                  const varExists = existingFood.variations.some(v => v.id === newRecipe.variations[0].id);
                  if (varExists) { updatedVariations = existingFood.variations.map(v => v.id === newRecipe.variations[0].id ? newRecipe.variations[0] : v); } 
                  else { updatedVariations = [...existingFood.variations, newRecipe.variations[0]]; }
              }

              return { ...prev, menu: finalMenu, recipes: { ...prev.recipes, [newRecipe.id]: { ...newRecipe, variations: updatedVariations } }, latestUpdates: newUpdates };
            });
            setFoodId(newRecipe.id); setView('variations'); setEditData(null); setAlertMsg("Recipe Saved!");
          };

          const confirmImport = () => {
              const newFood = { ...importPrompt, id: importPrompt.id + '-' + Date.now(), name: importPrompt.name + ' (Shared)', isCustom: true };
              const catId = newFood.categoryId || 'snacks';
              const catExists = appData.menu.find(c => c.id === catId);
              const finalCatId = catExists ? catId : 'snacks';
              
              handleCreateRecipe({
                  newRecipe: newFood,
                  categoryId: finalCatId,
                  subcategoryDetails: { id: 'shared-recipes', name: 'Shared Recipes' },
                  isEdit: false
              });
              setImportPrompt(null);
          };

          const handleEditRecipe = (variation) => {
              const food = appData.recipes[foodId];
              const catId = food.categoryId || 'snacks';
              const activeCat = appData.menu.find(c => c.id === catId);
              const subcat = activeCat?.subcategories?.find(s => s.foods?.some(f => f.id === foodId));
              setEditData({ foodId, foodName: food.name, variation, categoryId: catId, subcategoryId: subcat ? subcat.id : '' });
              setView('create');
          };

          const handleDeleteVariation = (varId) => {
            setAppData(prev => {
                const food = prev.recipes[foodId];
                const updatedVariations = food.variations.filter(v => v.id !== varId);
                
                if (updatedVariations.length === 0) {
                    const newRecipes = { ...prev.recipes }; delete newRecipes[foodId];
                    const newMenu = prev.menu.map(cat => ({ 
                        ...cat, subcategories: (cat.subcategories || []).map(sub => ({ ...sub, foods: sub.foods.filter(f => f.id !== foodId) })).filter(sub => sub.foods.length > 0)
                    }));
                    
                    let newUpdates = prev.latestUpdates.filter(u => u.foodId !== foodId);
                    if (newUpdates.length < 8) {
                        const currentIds = newUpdates.map(u => u.foodId);
                        const availableFoods = Object.values(prev.recipes).filter(f => f.id !== foodId && !currentIds.includes(f.id));
                        const slotsToFill = 8 - newUpdates.length;
                        for(let i=0; i<slotsToFill; i++) {
                            if(availableFoods.length > 0) {
                                const repl = availableFoods.pop();
                                newUpdates.push({ id: Date.now().toString() + i, type: 'food', foodId: repl.id, title: repl.name, categoryId: repl.categoryId || 'snacks' });
                            }
                        }
                    }

                    return { ...prev, menu: newMenu, recipes: newRecipes, latestUpdates: newUpdates, trash: [...(prev.trash || []), food] };
                } else {
                    return { ...prev, recipes: { ...prev.recipes, [foodId]: { ...food, variations: updatedVariations } } };
                }
            });
            
            const food = appData.recipes[foodId];
            if (food.variations.length <= 1) { setView('home'); setFoodId(null); } else { setView('variations'); }
            setAlertMsg("Deleted successfully.");
          };

          const handleUpdateVariation = (fId, updatedVariation) => {
            setAppData(prev => {
                const food = prev.recipes[fId];
                const updatedVariations = food.variations.map(v => v.id === updatedVariation.id ? updatedVariation : v);
                return { ...prev, recipes: { ...prev.recipes, [fId]: { ...food, variations: updatedVariations } } };
            });
          };

          const handleRestoreRecipe = (recipe) => {
            setAppData(prev => {
                const catId = recipe.categoryId || 'snacks';
                const newMenu = prev.menu.map(cat => {
                    if (cat.id === catId) {
                        let subcats = [...(cat.subcategories || [])]; 
                        let myRecs = subcats.find(s => s.id === 'my-recipes');
                        if (!myRecs) { subcats.push({ id: 'my-recipes', name: 'My Recipes', foods: [{ id: recipe.id, name: recipe.name }] }); }
                        else { subcats = subcats.map(s => s.id === 'my-recipes' ? { ...s, foods: [...s.foods, { id: recipe.id, name: recipe.name }] } : s); }
                        return { ...cat, subcategories: subcats };
                    }
                    return cat;
                });
                return { ...prev, menu: newMenu, recipes: { ...prev.recipes, [recipe.id]: recipe }, trash: prev.trash.filter(r => r.id !== recipe.id) };
            });
            setAlertMsg(`${recipe.name} restored.`);
          };

          const handleDeletePerm = (id) => { setAppData(prev => ({ ...prev, trash: prev.trash.filter(r => r.id !== id) })); setAlertMsg(`Recipe permanently deleted.`); };
          const handleImportData = (importedData) => { setAppData(importedData.appData); setFavourites(importedData.favourites); setQueue(importedData.queue); setView('home'); };

          let headerTitle = "Food Maker";
          if (view === 'variations' && foodId) headerTitle = appData.recipes[foodId]?.name;
          if (view === 'calcMode') headerTitle = "Calculation";
          if (view === 'recipe' && foodId && variationId) { const food = appData.recipes[foodId]; const variation = food?.variations.find(v => v.id === variationId); headerTitle = `${food?.name} - ${variation?.name}`; }

          return (
            <div className="h-full w-full flex flex-col overflow-hidden selection:bg-amber-200 relative bg-[#FAF8F5]">
              <CustomAlert message={alertMsg} onClose={() => setAlertMsg(null)} />
              <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(null)} />
              
              <Header 
                onMenuClick={() => setIsMenuOpen(true)} onBack={goBack} view={view} title={headerTitle}
                isFavourite={isSavedVar(favourites, foodId, variationId)} toggleFavourite={toggleFavourite} 
                isQueued={isSavedVar(queue, foodId, variationId)} toggleQueue={toggleQueue} 
                onShare={handleShare} onAboutClick={() => setView('about')} setView={setView}
              />
              
              <SideMenu 
                isOpen={isMenuOpen} onClose={() => setIsMenuOpen(false)} onSelectFood={handleSelectFood} onOpenFavourites={() => setView('favourites')}
                onOpenQueue={() => setView('queue')} onOpenCreate={() => { setEditData(null); setView('create'); }} onOpenTrash={() => setView('trash')}
                menuData={appData.menu} recipes={appData.recipes}
              />

              <main className="flex-1 overflow-hidden relative">
                {view === 'home' && <HomeView onSelectFood={handleSelectFood} latestUpdates={appData.latestUpdates} menu={appData.menu} onReorderDiscover={handleReorderDiscover} />}
                {view === 'favourites' && <SavedListView type="fav" items={favourites} recipes={appData.recipes} onSelectSaved={handleSelectSaved} onRemove={(id) => setFavourites(prev => prev.filter(f => f.id !== id))} />}
                {view === 'queue' && <SavedListView type="queue" items={queue} recipes={appData.recipes} onSelectSaved={handleSelectSaved} onRemove={(id) => setQueue(prev => prev.filter(q => q.id !== id))} />}
                {view === 'create' && <CreateRecipeView onSave={handleCreateRecipe} categories={appData.menu} recipes={appData.recipes} showAlert={setAlertMsg} editData={editData} onConfirm={confirmAction} />}
                {view === 'settings' && <SettingsView appData={appData} favourites={favourites} queue={queue} onImport={handleImportData} setAlertMsg={setAlertMsg} />}
                {view === 'about' && <AboutView />}
                {view === 'trash' && <TrashView trash={appData.trash} onRestore={handleRestoreRecipe} onDeletePerm={handleDeletePerm} onConfirm={confirmAction} />}
                {view === 'variations' && <VariationsView food={appData.recipes[foodId]} onSelectVariation={handleSelectVariation} onTogglePin={(fId, remove) => remove ? handleUnpinFromDiscover(fId) : setReplaceDiscoverModal(fId)} isPinned={appData.latestUpdates.some(u => u.foodId === foodId)} favourites={favourites} queue={queue} onConfirm={confirmAction} onQuickSave={handleQuickSaveTrigger} />}
                {view === 'calcMode' && <CalcModeView onSelectMode={handleSelectMode} />}
                {view === 'recipe' && (
                  <RecipeView variation={appData.recipes[foodId].variations.find(v => v.id === variationId)} mode={calcMode} calcParams={calcParams} setCalcParams={setCalcParams} onUpdateVariation={(updatedVar) => handleUpdateVariation(foodId, updatedVar)} onEditRecipe={handleEditRecipe} onDeleteRecipe={handleDeleteVariation} onConfirm={confirmAction} />
                )}
              </main>

              {replaceDiscoverModal && (
                <div className="fixed inset-0 bg-stone-900/60 z-[70] flex flex-col items-center justify-end p-4 fade-in" onClick={() => setReplaceDiscoverModal(null)}>
                    <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl slide-in-from-bottom-4 flex flex-col max-h-[80vh]" onClick={e => e.stopPropagation()}>
                        <h3 className="font-display font-bold text-xl text-stone-800 mb-2">Pin to Discover</h3>
                        <p className="font-sans text-stone-500 mb-4 text-[0.95rem]">Select a current item to replace on your home screen.</p>
                        <div className="space-y-2 mb-4 overflow-y-auto flex-1 pr-2">
                            {appData.latestUpdates.map(u => (
                                <button key={u.id} onClick={() => handlePinToDiscover(u.id)} className="w-full text-left p-4 bg-stone-50 rounded-xl active:bg-stone-100 transition-colors border border-stone-200 flex justify-between items-center group">
                                    <div className="font-sans font-bold text-stone-800">{u.title}</div>
                                    <i className="fa-solid fa-right-left text-stone-300 group-hover:text-stone-500"></i>
                                </button>
                            ))}
                        </div>
                        <button onClick={() => setReplaceDiscoverModal(null)} className="w-full bg-stone-100 text-stone-700 font-sans font-bold py-3 rounded-xl active:scale-95 transition-transform mt-2">
                            Cancel
                        </button>
                    </div>
                </div>
              )}

              {replaceQueueModal && (
                <div className="fixed inset-0 bg-stone-900/60 z-[70] flex items-center justify-center p-4 fade-in" onClick={() => setReplaceQueueModal(null)}>
                    <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl" onClick={e => e.stopPropagation()}>
                        <h3 className="font-display font-bold text-xl text-stone-800 mb-2">Up Next is Full</h3>
                        <p className="font-sans text-stone-500 mb-4 text-[0.95rem]">You can only have 3 recipes in Up Next. Which one would you like to replace?</p>
                        <div className="space-y-2 mb-4">
                            {queue.map(q => {
                                const food = appData.recipes[q.foodId];
                                const variation = food?.variations.find(v => v.id === q.variationId);
                                return (
                                    <button key={q.id} onClick={() => confirmQueueReplace(q.id)} className="w-full text-left p-4 bg-stone-50 rounded-xl active:bg-stone-100 transition-colors border border-stone-200 flex justify-between items-center group">
                                        <div>
                                            <div className="font-sans font-bold text-stone-800">{food?.name}</div>
                                            <div className="font-sans text-sm text-stone-500">{variation?.name}</div>
                                        </div>
                                        <i className="fa-solid fa-right-left text-stone-300 group-hover:text-stone-500"></i>
                                    </button>
                                );
                            })}
                        </div>
                        <button onClick={() => setReplaceQueueModal(null)} className="w-full bg-stone-100 text-stone-700 font-sans font-bold py-3 rounded-xl active:scale-95 transition-transform">
                            Cancel
                        </button>
                    </div>
                </div>
              )}

              {importPrompt && (
                  <div className="fixed inset-0 bg-stone-900/60 z-[100] flex items-center justify-center p-4 fade-in" onClick={() => setImportPrompt(null)}>
                      <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center" onClick={e => e.stopPropagation()}>
                          <div className="w-16 h-16 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-4">
                              <i className="fa-solid fa-download text-amber-500 text-2xl"></i>
                          </div>
                          <h3 className="font-display font-bold text-xl text-stone-800 mb-2">Import Recipe</h3>
                          <p className="font-sans text-stone-500 mb-6 text-[0.95rem]">You received a recipe for <strong>{importPrompt.name}</strong>. Would you like to save it to your app?</p>
                          <div className="flex gap-3">
                              <button onClick={() => setImportPrompt(null)} className="flex-1 bg-stone-100 text-stone-700 font-sans font-bold py-3 rounded-xl active:scale-95 transition-transform">
                                  Cancel
                              </button>
                              <button onClick={confirmImport} className="flex-1 bg-stone-900 text-white font-sans font-bold py-3 rounded-xl active:scale-95 transition-transform">
                                  Import
                              </button>
                          </div>
                      </div>
                  </div>
              )}

              {quickSaveModal && (
                  <div className="fixed inset-0 bg-stone-900/60 z-[100] flex items-end justify-center sm:items-center p-4 fade-in" onClick={() => setQuickSaveModal(null)}>
                      <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl slide-in-from-bottom-4" onClick={e => e.stopPropagation()}>
                          <h3 className="font-display font-bold text-xl text-stone-800 mb-4">Quick Save</h3>
                          <div className="space-y-3 font-sans">
                              <button onClick={() => handleConfirmQuickSave('fav')} className="w-full bg-rose-50 text-rose-600 font-sans font-bold p-4 rounded-2xl flex items-center gap-3 active:scale-95 transition-transform text-lg">
                                  <i className="fa-solid fa-heart"></i> My Favourites
                              </button>
                              <button onClick={() => handleConfirmQuickSave('queue')} className="w-full bg-amber-50 text-amber-600 font-sans font-bold p-4 rounded-2xl flex items-center gap-3 active:scale-95 transition-transform text-lg">
                                  <i className="fa-solid fa-list-check"></i> Up Next
                              </button>
                              <button onClick={() => setQuickSaveModal(null)} className="w-full bg-stone-100 text-stone-600 font-sans font-bold p-4 rounded-2xl mt-2 active:scale-95 transition-transform text-lg">
                                  Cancel
                              </button>
                          </div>
                      </div>
                  </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
